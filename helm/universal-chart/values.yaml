global:
  image:
    registry: ghcr.io/am-portfolio
    tag: latest
    pullPolicy: IfNotPresent
    imagePullSecrets: []
  vault:
    enabled: false
    role: am-backend-role
    authPath: auth/kubernetes
    serviceAccountName: "am-backend-sa" # Standardized backend SA
    # Preferred: HTTPS Vault (asrax). CSI/injector cannot dual-failover; use useAddressFallback for Kind HTTP.
    address: "https://vault.asrax.in"
    addressFallback: "http://vault.vault.svc:8200"
    useAddressFallback: false
    # Cluster CSI provider (no per-pod vault-agent sidecar). Agent inject only if csi.enabled=false.
    csi:
      enabled: true
    secrets: {}
    csi:
      enabled: false

environment: default
replicaCount: 1

language: python

image:
  repository: ""

port: 8080

service:
  port: 8080

# Security Defaults (Professional Standards)
security:
  # automountServiceAccountToken: false # Now dynamically handled based on Vault status
  readOnlyRootFilesystem: false

# Professional Resource Limits (Satisfies CKV_K8S_21/22/31)
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env: {}

# Optional pod template annotations (e.g. prometheus.io/scrape for am-observability)
podAnnotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Optional companion worker (same image, different entrypoint).
# Used by support-agent gateway + Temporal worker. Disabled by default.
companionWorker:
  enabled: false
  replicaCount: 1
  nameSuffix: worker
  entrypoint: ""
  # Leave port at 0 to skip containerPort and HTTP probes (Temporal workers).
  port: 0
  env: {}
  resources: {}
  httpProbes: false
  probes: {}
  podAnnotations: {}
