{{- if and .Values.configMap .Values.configMap.enabled }}
{{- $app := .Values.appConfig | default dict -}}
{{- $gb := $app.growthbook | default dict -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "universal-chart.fullname" . }}-config
  labels:
    {{- include "universal-chart.labels" . | nindent 4 }}
data:
  {{- if .Values.configMap.data }}
{{ toYaml .Values.configMap.data | indent 2 }}
  {{- else }}
  config.json: |
    {
      "domain": {{ $app.domain | default "" | quote }},
      "env": {{ .Values.environment | default "dev" | quote }},
      "google": {
        "webClientId": {{ $app.googleWebClientId | default "" | quote }},
        "iosClientId": {{ $app.googleIosClientId | default "" | quote }},
        "androidClientId": {{ $app.googleAndroidClientId | default "" | quote }}
      },
      "growthbook": {
        "enabled": {{ if hasKey $gb "enabled" }}{{ $gb.enabled }}{{ else }}false{{ end }},
        "apiHost": {{ $gb.apiHost | default "https://growthbook.asrax.in/gbapi" | quote }},
        "clientKey": {{ $gb.clientKey | default "" | quote }}
      }
    }
  {{- end }}
{{- end }}
