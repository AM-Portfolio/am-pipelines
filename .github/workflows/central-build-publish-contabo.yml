name: Central Build & Publish (Contabo gateways)

# Slim reusable for am-gateways: no Feature GHCR notice, no GitOps pin, no Contabo-central.
# Graph: Secrets+IaC ????????????????? Build ????????????????? Vuln ????????????????? Auto sync (main only) + Contabo Approve matrix.

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      image_name:
        required: true
        type: string
        description: "Contabo / Argo service name (e.g. am-api-gateway). Also default GHCR path."
      ghcr_image_name:
        required: false
        type: string
        default: ""
        description: >-
          Optional GHCR path under owner. Empty = <git-repo>/<image_name>
          (repo-scoped so github.token can write_package).
      registry:
        required: false
        type: string
        default: "ghcr.io"
      build_context:
        required: false
        type: string
        default: "."
      skip_security_scan:
        required: false
        type: boolean
        default: false
      skip_secrets_scan:
        required: false
        type: boolean
        default: false
      skip_iac_scan:
        required: false
        type: boolean
        default: false
      skip_vulnerability_scan:
        required: false
        type: boolean
        default: false
      no_cache:
        required: false
        type: boolean
        default: false
      pipelines_ref:
        required: false
        type: string
        default: "develop"
        description: >-
          Git ref of AM-Portfolio/am-pipelines for Contabo scripts checkout.
          When testing a fix/* branch, set this to the same ref as the workflow
          uses: line (e.g. fix/contabo-stamp-env-secrets). Default main.
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: false
      ARGOCD_SERVER:
        required: false
      AM_GITHUB_PAT:
        required: false
      KUBECONFIG_NONPROD:
        required: false
      KUBECONFIG_PROD:
        required: false
    outputs:
      image_tag:
        description: "Published GHCR image tag (run id)"
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: "Published image digest"
        value: ${{ jobs.build.outputs.image_digest }}
      image_repository:
        description: "Published image repository (full ghcr.io/... ref)"
        value: ${{ jobs.build.outputs.image_repository }}
      image_repository_path:
        description: "Helm image.repository path under registry (<git-repo>/<image_name>)"
        value: ${{ jobs.build.outputs.image_repository_path }}

jobs:
  security-scan:
    name: Security Scan (Secrets)
    # Skip when caller already ran a shared security gate (e.g. unified-ci.yml)
    if: ${{ !inputs.skip_security_scan && !inputs.skip_secrets_scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog needs history to find leaks

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          extra_args: --only-verified

  # ============================================================
  # MISCONFIG SCAN (IaC) ????????????????? GitHub-hosted runner
  # Scans Helm charts and Terraform for security misconfigurations
  # ============================================================

  misconfig-scan:
    name: Security Scan (IaC)
    # Skip when caller already ran a shared security gate (e.g. unified-ci.yml)
    if: ${{ !inputs.skip_security_scan && !inputs.skip_iac_scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./
          framework: helm,terraform,kubernetes
          soft_fail: true # Set to true to avoid blocking the workflow
          quiet: true
          output_format: cli,sarif
          download_external_modules: true
          log_level: ERROR

  # ============================================================
  # BUILD ????????????????? GitHub-hosted runner
  # Compiles, tests, builds and pushes Docker image to GHCR
  # ============================================================

  build:
    name: Build & Push
    needs: [security-scan, misconfig-scan]
    # Run when security jobs succeeded OR were intentionally skipped by caller
    if: |
      always() &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.push.outputs.tag }}
      image_repository: ${{ steps.push.outputs.repository }}
      image_repository_path: ${{ steps.push.outputs.repository_path }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - uses: actions/checkout@v4

      # ???????????? Java ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
      - name: Set up JDK
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Create Maven settings.xml
        if: ${{ inputs.language == 'java' }}
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build Java Package
        if: ${{ inputs.language == 'java' }}
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MODULE="${{ inputs.working_directory }}"
          ROOT_POM="${{ github.workspace }}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE" != "." ] && grep -Fq "<module>${MODULE}</module>" "$ROOT_POM"; then
            echo "Monorepo reactor build: -pl ${MODULE} -am"
            mvn -B -f "$ROOT_POM" clean package -pl "$MODULE" -am -DskipTests
          else
            mvn -B -f "${{ github.workspace }}/${MODULE}/pom.xml" clean package -DskipTests
          fi

      - name: Run Java Tests
        if: ${{ inputs.language == 'java' }}
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MODULE="${{ inputs.working_directory }}"
          ROOT_POM="${{ github.workspace }}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE" != "." ] && grep -Fq "<module>${MODULE}</module>" "$ROOT_POM"; then
            mvn -B -f "$ROOT_POM" test -pl "$MODULE" -am || echo "Test step failed or skipped"
          else
            mvn -B -f "${{ github.workspace }}/${MODULE}/pom.xml" test || echo "Test step failed or skipped"
          fi

      # ???????????? Python ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
      - name: Set up Python
        if: ${{ inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        if: ${{ inputs.language == 'python' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python Tests
        if: ${{ inputs.language == 'python' }}
        run: |
          pip install pytest flake8
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          pytest || echo "Tests failed or not found - marking as skipped for now"

      # ???????????? Node.js / React ??????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
      - name: Set up Node.js
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ inputs.working_directory }}/package-lock.json"

      - name: Install Node Dependencies
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm ci

      - name: Build Node/React Application
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm run build --if-present

      - name: Run Node Tests
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm test --if-present

      # ???????????? Docker ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.image_name != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          # Use job github.token (packages:write). Do not prefer org GHCR_TOKEN ?????? a dead PAT
          # blocks login (|| does not fall through). Cross-repo pulls need package Actions access.
          password: ${{ github.token }}

      # Existing org packages often lack "Actions access" for this repo ?????? push write_package.
      # Default push path is repo-scoped: <git-repo>/<image_name> (github.token can write).
      - name: Ensure GHCR package linked to this repository
        if: ${{ inputs.image_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME_INPUT: ${{ inputs.ghcr_image_name }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -n "${GHCR_IMAGE_NAME_INPUT}" ]; then
            GHCR_IMAGE_NAME="${GHCR_IMAGE_NAME_INPUT}"
          elif [[ "${IMAGE_NAME}" == */* ]]; then
            GHCR_IMAGE_NAME="${IMAGE_NAME}"
          else
            GHCR_IMAGE_NAME="${REPO_NAME}/${IMAGE_NAME}"
          fi
          GHCR_IMAGE_NAME=$(echo "${GHCR_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          export GHCR_IMAGE_NAME
          PKG_ENC=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["GHCR_IMAGE_NAME"], safe=""))')
          REPO_ID=$(gh api "repos/${{ github.repository }}" --jq .id)
          echo "Linking package container/${GHCR_IMAGE_NAME} -> repo id $REPO_ID"
          gh api --method PUT \
            "orgs/${{ github.repository_owner }}/packages/container/${PKG_ENC}/repositories/${REPO_ID}" \
            || echo "::warning::Package link skipped (missing package yet, or token lacks package admin)"

      - name: Build and Push Docker Image
        id: push
        if: ${{ inputs.image_name != '' }}
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME_INPUT: ${{ inputs.ghcr_image_name }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -n "${GHCR_IMAGE_NAME_INPUT}" ]; then
            GHCR_IMAGE_NAME="${GHCR_IMAGE_NAME_INPUT}"
          elif [[ "${IMAGE_NAME}" == */* ]]; then
            GHCR_IMAGE_NAME="${IMAGE_NAME}"
          else
            GHCR_IMAGE_NAME="${REPO_NAME}/${IMAGE_NAME}"
          fi
          IMAGE_ID=${{ inputs.registry }}/${{ github.repository_owner }}/${GHCR_IMAGE_NAME}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          BASE_REG="ghcr.io/${{ github.repository_owner }}/"
          BASE_REG=$(echo $BASE_REG | tr '[A-Z]' '[a-z]')
          TAG="${{ github.run_id }}"

          echo "Building $IMAGE_ID ..."
          CACHE_ARG=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            CACHE_ARG="--no-cache"
          fi

          docker build $CACHE_ARG -f Dockerfile \
            --build-arg BASE_REGISTRY=$BASE_REG \
            --build-arg GITHUB_PACKAGES_USERNAME=${{ github.actor }} \
            --build-arg GITHUB_PACKAGES_TOKEN=${GHCR_TOKEN} \
            --build-arg BUILD_ID=${{ github.run_id }} \
            -t $IMAGE_ID:$TAG \
            -t $IMAGE_ID:latest \
            ${{ inputs.build_context }}

          echo "Pushing $IMAGE_ID ..."
          docker push $IMAGE_ID:$TAG
          docker push $IMAGE_ID:latest

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_ID:$TAG" | awk -F@ '{print $2}')
          echo "repository=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          # Relative path for helm image.repository (under global.image.registry).
          echo "repository_path=${GHCR_IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  vulnerability-scan:
    name: Security Scan (Vulnerabilities)
    needs: build
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      !inputs.skip_security_scan &&
      !inputs.skip_vulnerability_scan
    permissions:
      contents: read
      packages: read
    steps:
      - name: Lowercase Image Ref
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME_INPUT: ${{ inputs.ghcr_image_name }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -n "${GHCR_IMAGE_NAME_INPUT}" ]; then
            GHCR_IMAGE_NAME="${GHCR_IMAGE_NAME_INPUT}"
          elif [[ "${IMAGE_NAME}" == */* ]]; then
            GHCR_IMAGE_NAME="${IMAGE_NAME}"
          else
            GHCR_IMAGE_NAME="${REPO_NAME}/${IMAGE_NAME}"
          fi
          ref="ghcr.io/${{ github.repository_owner }}/${GHCR_IMAGE_NAME}:${{ github.run_id }}"
          echo "ref=$(echo $ref | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Non-blocking (reports but continues)

  # Auto sync Contabo preprod — main push or workflow_dispatch on main.
  # Must pin then sync (same as Contabo Approve) so nested image.repository lands.
  # Regression: notification #67 skipped deploy when if: omitted workflow_dispatch.
  auto-sync-preprod:
    name: Auto sync → preprod (pin then sync)
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    if: |
      always() &&
      inputs.image_name != '' &&
      (
        (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) ||
        (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master'))
      ) &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Public am-pipelines: github.token only (stale AM_GITHUB_PAT breaks checkout).
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: ${{ inputs.pipelines_ref }}
          # Public am-pipelines: prefer github.token so a stale AM_GITHUB_PAT cannot break checkout.
          token: ${{ github.token }}

      - name: Resolve image tag
        id: tag
        env:
          TAG_FROM_BUILD: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_FROM_BUILD:-}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag from build"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Contabo pin then sync (preprod)
        env:
          GH_TOKEN: ${{ secrets.AM_GITHUB_PAT || secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: ${{ inputs.image_name }}
          INPUT_ENVIRONMENT: preprod
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::notice::Auto sync Contabo preprod: pin then sync (main only)."
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-pin-then-sync.sh
          am-pipelines-repo/scripts/ci/argo-pin-then-sync.sh

  contabo-approve:
    name: Contabo Argo → ${{ matrix.env }} (approve)
    # Removed auto-sync-preprod from needs so it runs in parallel
    # Regression guard (notification #67): workflow_dispatch on main MUST enable Approve.
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    if: |
      always() &&
      inputs.image_name != '' &&
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'master')) ||
        (github.head_ref || github.ref_name) == 'develop' ||
        startsWith(github.head_ref || github.ref_name, 'feature/') ||
        startsWith(github.head_ref || github.ref_name, 'feat/') ||
        startsWith(github.head_ref || github.ref_name, 'fix/') ||
        startsWith(github.head_ref || github.ref_name, 'hotfix/')
      )
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'master')) && '["dev","preprod","prod","dr"]' || '["dev","preprod"]') }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    permissions:
      contents: read
    steps:
      # am-pipelines is public: use github.token only. A stale AM_GITHUB_PAT
      # (truthy but invalid) overrides || github.token and breaks checkout on
      # public callers (e.g. am-portfolio) with "terminal prompts disabled".
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: ${{ inputs.pipelines_ref }}
          # Public am-pipelines: prefer github.token so a stale AM_GITHUB_PAT cannot break checkout.
          token: ${{ github.token }}

      - name: Resolve image tag
        id: tag
        env:
          TAG_FROM_BUILD: ${{ needs.build.outputs.image_tag }}
          REPO_PATH_FROM_BUILD: ${{ needs.build.outputs.image_repository_path }}
          IMAGE_REPO_FULL: ${{ needs.build.outputs.image_repository }}
        run: |
          set -euo pipefail
          TAG="${TAG_FROM_BUILD:-}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag from build"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Prefer explicit repository_path; else strip ghcr.io/<owner>/ from full ref.
          REPO_PATH="${REPO_PATH_FROM_BUILD:-}"
          if [[ -z "$REPO_PATH" && -n "${IMAGE_REPO_FULL:-}" ]]; then
            REPO_PATH="${IMAGE_REPO_FULL#ghcr.io/}"
            REPO_PATH="${REPO_PATH#*/}"
          fi
          echo "repository_path=${REPO_PATH}" >> "$GITHUB_OUTPUT"

      - name: Contabo pin then sync (dev/preprod)
        if: matrix.env == 'dev' || matrix.env == 'preprod'
        env:
          GH_TOKEN: ${{ secrets.AM_GITHUB_PAT || secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: ${{ inputs.image_name }}
          INPUT_ENVIRONMENT: ${{ matrix.env }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-pin-then-sync.sh
          # Roll (pin) first via set-image-tag — Argo git webhook / valueFiles SoT.
          # Sync second — avoid long Application PUT through Cloudflare (HTTP 504).
          am-pipelines-repo/scripts/ci/argo-pin-then-sync.sh
      - name: Contabo promote + wait (prod / dr)
        if: matrix.env == 'prod' || matrix.env == 'dr'
        env:
          GH_TOKEN: ${{ secrets.AM_GITHUB_PAT || secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN || github.token }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: ${{ inputs.image_name }}
          INPUT_ENVIRONMENT: ${{ matrix.env }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh

