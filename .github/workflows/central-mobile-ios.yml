# Central Mobile iOS — thin orchestrator.
# Helpers live under .github/workflows/ios/ (scripts) and .github/actions/checkout-ios-helpers.
# Called by am-modern-ui/mobile-ci.yml.

name: Central Mobile iOS

on:
  workflow_call:
    inputs:
      working_directory:
        description: "App directory relative to repo root (e.g. am_app)"
        required: true
        type: string
      flutter_channel:
        required: false
        type: string
        default: "stable"
      build_mode:
        description: "debug | release"
        required: false
        type: string
        default: "release"
      run_analyze:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true
      upload_artifact:
        required: false
        type: boolean
        default: true
      keep_artifact:
        description: "Also upload a long-lived ios-keep-* artifact for backup / reuse"
        required: false
        type: boolean
        default: false
      deploy_internal:
        description: "Upload IPA to TestFlight (internal)"
        required: false
        type: boolean
        default: false
      deploy_production:
        description: "Submit to App Store (after TestFlight)"
        required: false
        type: boolean
        default: false
      bundle_id:
        description: "iOS bundle identifier"
        required: false
        type: string
        default: "com.asrax.aminvestment"
      gh_env_internal:
        required: false
        type: string
        default: "ios-internal"
      gh_env_prod:
        required: false
        type: string
        default: "ios-prod"
      am_domain:
        description: "Baked API host (AM_DOMAIN dart-define)"
        required: false
        type: string
        default: ""
      am_env:
        description: "Baked env label (AM_ENV): dev | preprod | prod"
        required: false
        type: string
        default: ""
      testflight_beta_group:
        description: "TestFlight beta group name (empty = all Internal groups)"
        required: false
        type: string
        default: ""
      skip_ios_build:
        description: "Skip Flutter IPA build; reuse a prior Actions artifact"
        required: false
        type: boolean
        default: false
      reuse_artifact_run_id:
        description: "Prior workflow run id that owns the IPA artifact"
        required: false
        type: string
        default: ""
      reuse_artifact_name:
        description: "Prior artifact name (e.g. ios-release-38629861487)"
        required: false
        type: string
        default: ""
      reuse_version_name:
        description: "Marketing version of the reused IPA (e.g. 2.0.0)"
        required: false
        type: string
        default: ""
      reuse_version_code:
        description: "CFBundleVersion of the reused IPA (e.g. 207)"
        required: false
        type: string
        default: ""
    secrets:
      IOS_CERTIFICATE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      IOS_KEYCHAIN_PASSWORD:
        required: false
      CERTIFICATE_PRIVATE_KEY:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: false
      GOOGLE_WEB_CLIENT_ID:
        required: false
      GOOGLE_IOS_CLIENT_ID:
        required: false
      GROWTHBOOK_CLIENT_KEY:
        required: false

jobs:
  ios-build:
    name: iOS -> Build
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name || steps.meta_reuse.outputs.artifact_name }}
      version_name: ${{ steps.version.outputs.version_name || steps.version_reuse.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code || steps.version_reuse.outputs.version_code }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout am-pipelines iOS helpers
        if: ${{ inputs.skip_ios_build }}
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          # Same SoT as callers' uses: …@main (workflow_sha is the *caller* SHA under workflow_call).
          ref: main
          path: _am_pipelines
          sparse-checkout: |
            .github/workflows/ios
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Validate reuse inputs
        if: ${{ inputs.skip_ios_build }}
        working-directory: ${{ github.workspace }}
        env:
          REUSE_ARTIFACT_RUN_ID: ${{ inputs.reuse_artifact_run_id }}
          REUSE_ARTIFACT_NAME: ${{ inputs.reuse_artifact_name }}
          REUSE_VERSION_NAME: ${{ inputs.reuse_version_name }}
          REUSE_VERSION_CODE: ${{ inputs.reuse_version_code }}
        run: bash _am_pipelines/.github/workflows/ios/validate_reuse.sh

      - name: Download reused IPA artifact
        if: ${{ inputs.skip_ios_build }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reuse_artifact_name }}
          run-id: ${{ inputs.reuse_artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/ios-ci-out

      - name: Stage reused version and artifact
        if: ${{ inputs.skip_ios_build }}
        id: version_reuse
        working-directory: ${{ github.workspace }}
        env:
          REUSE_VERSION_NAME: ${{ inputs.reuse_version_name }}
          REUSE_VERSION_CODE: ${{ inputs.reuse_version_code }}
          REUSE_ARTIFACT_RUN_ID: ${{ inputs.reuse_artifact_run_id }}
          REUSE_ARTIFACT_NAME: ${{ inputs.reuse_artifact_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          AM_ENV: ${{ inputs.am_env }}
        run: bash _am_pipelines/.github/workflows/ios/stage_reuse.sh

      - name: Publish reused artifact for this run
        if: ${{ inputs.skip_ios_build }}
        id: meta_reuse
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="ios-${{ inputs.build_mode }}-${{ github.run_id }}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload reused iOS artifact
        if: ${{ inputs.skip_ios_build && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta_reuse.outputs.artifact_name }}
          path: ${{ github.workspace }}/ios-ci-out/
          if-no-files-found: error
          retention-days: 14

      - name: Checkout caller repository
        if: ${{ !inputs.skip_ios_build }}
        uses: actions/checkout@v4

      - name: Checkout am-pipelines iOS helpers
        if: ${{ !inputs.skip_ios_build }}
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          # Same SoT as callers' uses: …@main (workflow_sha is the *caller* SHA under workflow_call).
          ref: main
          path: _am_pipelines
          sparse-checkout: |
            .github/workflows/ios
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Set up Flutter
        if: ${{ !inputs.skip_ios_build }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Flutter prepare (doctor, pub get, build_runner)
        if: ${{ !inputs.skip_ios_build }}
        working-directory: ${{ github.workspace }}
        run: bash _am_pipelines/.github/workflows/ios/flutter_prepare.sh

      - name: Inject Google Sign-In into Info.plist
        if: ${{ !inputs.skip_ios_build }}
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: bash ${{ github.workspace }}/_am_pipelines/.github/workflows/ios/inject_google_plist.sh

      - name: Import signing certificate and profile
        if: ${{ !inputs.skip_ios_build }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DEPLOY_INTERNAL: ${{ inputs.deploy_internal }}
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
        run: bash ${{ github.workspace }}/_am_pipelines/.github/workflows/ios/sign_import.sh

      - name: Resolve Flutter version
        if: ${{ !inputs.skip_ios_build }}
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          AM_ENV: ${{ inputs.am_env }}
        run: bash ${{ github.workspace }}/_am_pipelines/.github/workflows/ios/resolve_version.sh

      - name: Build iOS IPA
        if: ${{ !inputs.skip_ios_build }}
        env:
          AM_DOMAIN: ${{ inputs.am_domain }}
          AM_ENV_LABEL: ${{ inputs.am_env }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          AM_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AM_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          AM_GROWTHBOOK_CLIENT_KEY: ${{ secrets.GROWTHBOOK_CLIENT_KEY }}
        run: bash ${{ github.workspace }}/_am_pipelines/.github/workflows/ios/build_ipa.sh

      - name: Stage IPA artifact
        if: ${{ !inputs.skip_ios_build }}
        id: meta
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          RUN_ID: ${{ github.run_id }}
        run: bash ${{ github.workspace }}/_am_pipelines/.github/workflows/ios/stage_ipa.sh

      - name: Upload iOS artifact
        if: ${{ !inputs.skip_ios_build && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ github.workspace }}/ios-ci-out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS keep artifact (backup)
        if: ${{ !inputs.skip_ios_build && inputs.upload_artifact && inputs.keep_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-keep-${{ github.sha }}
          path: ${{ github.workspace }}/ios-ci-out/
          if-no-files-found: error
          retention-days: 90

  ios-internal:
    name: iOS -> TestFlight
    needs: ios-build
    if: ${{ inputs.deploy_internal }}
    runs-on: macos-latest
    environment: ${{ inputs.gh_env_internal }}
    permissions:
      contents: read
    steps:
      - name: Checkout am-pipelines iOS helpers
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          # Same SoT as callers' uses: …@main (workflow_sha is the *caller* SHA under workflow_call).
          ref: main
          path: _am_pipelines
          sparse-checkout: |
            .github/workflows/ios
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Release context
        env:
          TITLE: TestFlight release
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          ARTIFACT_NAME: ${{ needs.ios-build.outputs.artifact_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          AM_ENV: ${{ inputs.am_env }}
          NOTICE_PREFIX: TestFlight target
        run: bash _am_pipelines/.github/workflows/ios/release_context.sh

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios-build.outputs.artifact_name }}
          path: ios-out

      - name: Write App Store Connect API key
        env:
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          PURPOSE: TestFlight
        run: bash _am_pipelines/.github/workflows/ios/write_asc_key.sh

      - name: Upload to TestFlight
        id: upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          UPLOAD_MODE: testflight
        run: bash _am_pipelines/.github/workflows/ios/altool_upload.sh

      - name: Wait for ASC processing and assign beta groups
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          BETA_GROUP_NAME: ${{ inputs.testflight_beta_group }}
          UPLOAD_STATUS: ${{ steps.upload.outputs.upload_status }}
        run: python3 _am_pipelines/.github/workflows/ios/testflight_wait_assign.py

  ios-prod:
    name: iOS -> App Store
    needs: [ios-build, ios-internal]
    if: ${{ always() && inputs.deploy_production && (needs.ios-internal.result == 'success' || needs.ios-internal.result == 'skipped') && needs.ios-build.result == 'success' }}
    runs-on: macos-latest
    environment: ${{ inputs.gh_env_prod }}
    permissions:
      contents: read
    steps:
      - name: Require TestFlight when both tracks requested
        if: ${{ inputs.deploy_internal && needs.ios-internal.result != 'success' }}
        run: |
          echo "::error::App Store submit requires TestFlight upload to succeed first"
          exit 1

      - name: Checkout am-pipelines iOS helpers
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          # Same SoT as callers' uses: …@main (workflow_sha is the *caller* SHA under workflow_call).
          ref: main
          path: _am_pipelines
          sparse-checkout: |
            .github/workflows/ios
            .github/actions
          sparse-checkout-cone-mode: false

      - name: Release context
        env:
          TITLE: App Store release
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          ARTIFACT_NAME: ${{ needs.ios-build.outputs.artifact_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          AM_ENV: ${{ inputs.am_env }}
          EXTRA_ROW_LABEL: TestFlight job
          EXTRA_ROW_VALUE: ${{ needs.ios-internal.result }}
          NOTICE_PREFIX: App Store gate
        run: bash _am_pipelines/.github/workflows/ios/release_context.sh

      - name: Skip re-upload when TestFlight already delivered binary
        if: ${{ needs.ios-internal.result == 'success' }}
        env:
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Binary upload"
            echo ""
            echo "Skipped altool re-upload — \`${VERSION_NAME}\` (\`${VERSION_CODE}\`) already on ASC via TestFlight."
            echo "Next step: Submit for App Store Review via ASC API."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Skipped App Store altool re-upload — ${VERSION_NAME} (${VERSION_CODE}) already on ASC via TestFlight"

      - name: Download build artifact
        if: ${{ needs.ios-internal.result != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios-build.outputs.artifact_name }}
          path: ios-out

      - name: Write App Store Connect API key
        env:
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          PURPOSE: App Store submit
        run: bash _am_pipelines/.github/workflows/ios/write_asc_key.sh

      - name: Upload IPA when TestFlight did not
        if: ${{ needs.ios-internal.result != 'success' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          UPLOAD_MODE: appstore
        run: bash _am_pipelines/.github/workflows/ios/altool_upload.sh

      - name: Submit for App Store Review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
        run: python3 _am_pipelines/.github/workflows/ios/appstore_submit.py
