name: Publish Library
# Reusable workflow — called by repo workflows on push/merge to main (and PRs where configured).
#
# Inputs:
#   action: publish (deploy/release) | verify (build/test only, no registry push)
#   use_release_version: request -SNAPSHOT strip (honored only on refs/heads/main or refs/heads/master)
#
# java   → mvn deploy → GitHub Packages (github / github-core / github-investment ids)
# python → wheel/sdist → GitHub Release
# flutter → analyze/test → zip → GitHub Release (skipped when pubspec has publish_to: none)

on:
  workflow_call:
    inputs:
      language:
        description: 'SDK language: python | java | flutter'
        required: true
        type: string
      working_directory:
        description: 'Path to the SDK/library directory (relative to repo root)'
        required: true
        type: string
      sdk_name:
        description: 'Canonical name for release tags (e.g. am-common-lib)'
        required: false
        type: string
        default: ''
      action:
        description: 'publish (deploy/release) or verify (build/test only)'
        required: false
        type: string
        default: 'publish'
      use_release_version:
        description: 'Request -SNAPSHOT strip before Java publish (applied only on refs/heads/main or refs/heads/master)'
        required: false
        type: boolean
        default: false
      advance_snapshot:
        description: 'Whether to auto-advance Java version to next snapshot and push to branch (main/master only)'
        required: false
        type: boolean
        default: false
      maven_repo_id:
        description: 'Maven server id in pom.xml distributionManagement (java only)'
        required: false
        type: string
        default: 'github'
      maven_repo_url:
        description: 'GitHub Packages Maven URL (java only)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    name: Publish ${{ inputs.sdk_name || inputs.working_directory }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve SDK name
        id: meta
        run: |
          SDK_NAME="${{ inputs.sdk_name }}"
          if [ -z "$SDK_NAME" ]; then
            SDK_NAME=$(basename "${{ inputs.working_directory }}")
          fi
          echo "sdk_name=$SDK_NAME" >> $GITHUB_OUTPUT

      # ── Python ──────────────────────────────────────────────────────────
      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Python wheel and sdist
        if: inputs.language == 'python'
        working-directory: ${{ inputs.working_directory }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify Python package
        if: inputs.language == 'python' && inputs.action == 'verify'
        working-directory: ${{ inputs.working_directory }}
        run: |
          pip install pytest
          if [ -d "test" ] || [ -d "tests" ]; then pytest; else echo "No tests directory — skipping pytest."; fi

      - name: Read Python version
        if: inputs.language == 'python' && inputs.action == 'publish'
        id: py_version
        working-directory: ${{ inputs.working_directory }}
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*=\s*["\x27]\(.*\)["\x27].*/\1/' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Python SDK to GitHub Release
        if: inputs.language == 'python' && inputs.action == 'publish'
        working-directory: ${{ inputs.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK="${{ steps.meta.outputs.sdk_name }}"
          VER="${{ steps.py_version.outputs.version }}"
          TAG="${SDK}-v${VER}"
          WHL=$(ls dist/*.whl | xargs basename)
          cat > /tmp/release-notes.md <<EOF
          ## ${SDK} v${VER}
          ### Install
          \`\`\`bash
          pip install https://github.com/${{ github.repository }}/releases/download/${TAG}/${WHL}
          \`\`\`
          EOF
          gh release create "$TAG" dist/* --title "${SDK} v${VER}" --notes-file /tmp/release-notes.md --repo "${{ github.repository }}" \
            2>/dev/null || gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

      # ── Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create Maven settings.xml
        if: inputs.language == 'java'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Promote to release version (strip SNAPSHOT, CI only)
        if: >-
          inputs.language == 'java'
          && inputs.action == 'publish'
          && inputs.use_release_version
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        working-directory: ${{ inputs.working_directory }}
        run: |
          CURRENT=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "Current version: $CURRENT"
          if echo "$CURRENT" | grep -q 'SNAPSHOT'; then
            if [ -f "${{ github.workspace }}/pom.xml" ] && [ "${{ inputs.working_directory }}" != "." ] && [ "${{ inputs.working_directory }}" != "./" ]; then
              echo "Workspace-level root pom.xml found. Promoting parent and submodules at root."
              mvn -B -f "${{ github.workspace }}/pom.xml" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                -DremoveSnapshot -DgenerateBackupPoms=false
            else
              echo "Promoting version locally in working directory."
              mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                -DremoveSnapshot -DgenerateBackupPoms=false
            fi
          else
            echo "Already a release version — no change."
          fi

      - name: Verify Java library
        if: inputs.language == 'java' && inputs.action == 'verify'
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: mvn -B clean verify -DskipTests

      - name: Build and Deploy Java library to GitHub Packages
        if: inputs.language == 'java' && inputs.action == 'publish'
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mvn -B clean deploy -DskipTests > deploy.log 2>&1 || {
            status=$?
            cat deploy.log
            if grep -q "status code: 409" deploy.log || grep -q "Conflict (409)" deploy.log; then
              echo "WARNING: Library version already deployed (409 Conflict). Skipping deploy."
              exit 0
            else
              exit $status
            fi
          }
          cat deploy.log

      - name: Advance library to next snapshot and push
        if: >-
          inputs.language == 'java'
          && inputs.action == 'publish'
          && inputs.use_release_version
          && inputs.advance_snapshot
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -f "${{ github.workspace }}/pom.xml" ] && [ "${{ inputs.working_directory }}" != "." ] && [ "${{ inputs.working_directory }}" != "./" ]; then
            echo "Workspace-level root pom.xml found. Advancing parent and submodules at root."
            mvn -B -f "${{ github.workspace }}/pom.xml" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
              -DnextSnapshot=true -DgenerateBackupPoms=false
            echo "Verifying root build compiles with next snapshot version..."
            mvn -B -f "${{ github.workspace }}/pom.xml" clean compile -DskipTests
          else
            echo "Advancing version locally in working directory."
            mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
              -DnextSnapshot=true -DgenerateBackupPoms=false
            echo "Verifying local build compiles with next snapshot version..."
            mvn -B clean compile -DskipTests
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -u
            git commit -m "chore: bump version to next snapshot version [skip ci]"
            
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt $i..."
              git fetch origin
              if git pull --rebase --autostash origin $BRANCH_NAME; then
                if git push origin HEAD:${{ github.ref }}; then
                  echo "Push succeeded!"
                  exit 0
                fi
              else
                echo "Rebase conflicted. Aborting and retrying..."
                git rebase --abort
              fi
              echo "Waiting 5 seconds before retry..."
              sleep 5
            done
            echo "Failed to push version bump after $MAX_RETRIES attempts."
            exit 1
          else
            echo "No version changes detected."
          fi

      # ── Flutter ─────────────────────────────────────────────────────────
      - name: Set up Flutter
        if: inputs.language == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Skip non-publishable Flutter package
        if: inputs.language == 'flutter'
        id: flutter_publishable
        working-directory: ${{ inputs.working_directory }}
        run: |
          if grep -qE '^publish_to:\s*["\x27]?none' pubspec.yaml 2>/dev/null; then
            echo "publishable=false" >> $GITHUB_OUTPUT
            echo "publish_to: none — verify only."
          else
            echo "publishable=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify Flutter SDK
        if: inputs.language == 'flutter'
        working-directory: ${{ inputs.working_directory }}
        run: |
          flutter pub get
          flutter analyze
          if [ -d test ]; then flutter test; else echo "No test/ directory — skipping flutter test."; fi

      - name: Read Flutter version
        if: inputs.language == 'flutter' && inputs.action == 'publish' && steps.flutter_publishable.outputs.publishable == 'true'
        id: flutter_version
        working-directory: ${{ inputs.working_directory }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version://;s/["'"'"' ]//g;s/+.*//' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Zip Flutter SDK source
        if: inputs.language == 'flutter' && inputs.action == 'publish' && steps.flutter_publishable.outputs.publishable == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: |
          SDK="${{ steps.meta.outputs.sdk_name }}"
          VER="${{ steps.flutter_version.outputs.version }}"
          mkdir -p dist
          zip -r "dist/${SDK}-${VER}.zip" . --exclude "dist/*" ".git/*" ".dart_tool/*" "build/*"

      - name: Publish Flutter SDK to GitHub Release
        if: inputs.language == 'flutter' && inputs.action == 'publish' && steps.flutter_publishable.outputs.publishable == 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK="${{ steps.meta.outputs.sdk_name }}"
          VER="${{ steps.flutter_version.outputs.version }}"
          TAG="${SDK}-v${VER}"
          gh release create "$TAG" dist/*.zip --title "${SDK} v${VER}" --repo "${{ github.repository }}" \
            2>/dev/null || gh release upload "$TAG" dist/*.zip --clobber --repo "${{ github.repository }}"
