# Central Mobile Android - reusable workflow
# Called by app repos (e.g. am-modern-ui/mobile-android.yml).
#
# Phase 1: build APK/AAB + upload GitHub Actions artifact.
# Phase 5+: Play Internal (preprod). Phase 6+: Play Production (main only).
#
# Do not mix with central-build-publish.yml (web Docker -> Helm -> K8s).

name: Central Mobile Android

on:
  workflow_call:
    inputs:
      working_directory:
        description: "App directory relative to repo root (e.g. am_app)"
        required: true
        type: string
      flutter_channel:
        description: "Flutter channel"
        required: false
        type: string
        default: "stable"
      build_mode:
        description: "debug | release (Phase 1 default debug - no keystore required)"
        required: false
        type: string
        default: "debug"
      artifact_type:
        description: "apk | appbundle"
        required: false
        type: string
        default: "apk"
      run_analyze:
        description: "Run flutter analyze"
        required: false
        type: boolean
        default: true
      run_tests:
        description: "Run flutter test if test/ exists"
        required: false
        type: boolean
        default: true
      upload_artifact:
        description: "Upload build output as a workflow artifact"
        required: false
        type: boolean
        default: true
      deploy_preprod:
        description: "Legacy alias for deploy_internal (Play Internal)"
        required: false
        type: boolean
        default: false
      deploy_prod:
        description: "Legacy alias for deploy_production (Play Production)"
        required: false
        type: boolean
        default: false
      deploy_internal:
        description: "Upload to Play Internal Testing (main path)"
        required: false
        type: boolean
        default: false
      deploy_production:
        description: "Upload to Play Production (main path; after internal)"
        required: false
        type: boolean
        default: false
      package_name:
        description: "Android applicationId / Play package name (informational until Phase 5)"
        required: false
        type: string
        default: ""
      gh_env_preprod:
        required: false
        type: string
        description: "GitHub environment for Internal Testing (default android-internal)"
      gh_env_prod:
        required: false
        type: string
        description: "GitHub environment for Production (default android-prod)"
      version_code_offset:
        description: "Added to github.run_number for Play versionCode (use if Play already has a higher code)"
        required: false
        type: number
        default: 0
      am_domain:
        description: "Baked API host for native (AM_DOMAIN dart-define), e.g. am.asrax.in"
        required: false
        type: string
        default: ""
      am_env:
        description: "Baked env label for native (AM_ENV dart-define): dev | preprod | prod"
        required: false
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      PLAY_STORE_SERVICE_ACCOUNT_JSON:
        required: false
      GOOGLE_WEB_CLIENT_ID:
        required: false
      GOOGLE_IOS_CLIENT_ID:
        required: false
      GOOGLE_ANDROID_CLIENT_ID:
        required: false
      GROWTHBOOK_CLIENT_KEY:
        required: false

jobs:
  # ============================================================
  # BUILD - always runs when this workflow is called
  # ============================================================
  android-build:
    name: Android -> Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve pub dependencies
        working-directory: ${{ github.workspace }}
        run: |
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \;)
          for dir in $dirs; do
            (cd "$dir" && flutter pub get)
          done

      - name: Run code generation (build_runner)
        working-directory: ${{ github.workspace }}
        run: |
          dirs=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {})
          for dir in $dirs; do
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              echo "Running build_runner in $dir..."
              (cd "$dir" && flutter pub run build_runner build --delete-conflicting-outputs)
            fi
          done

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode --ignore-garbage > android/app/am_investment_keystore.jks

      - name: Create key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          CLEAN_STORE_PASSWORD=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASSWORD=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          cat <<EOF > android/key.properties
          storePassword=$CLEAN_STORE_PASSWORD
          keyPassword=$CLEAN_KEY_PASSWORD
          keyAlias=$CLEAN_KEY_ALIAS
          storeFile=am_investment_keystore.jks
          EOF

      - name: Resolve Play / Flutter version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # pubspec: version: 2.0.0+12  →  name=2.0.0  build=12
          RAW=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//')
          RAW=${RAW//$'\r'/}
          NAME=${RAW%%+*}
          BUILD=${RAW##*+}
          if [ "$NAME" = "$RAW" ] || [ -z "$BUILD" ] || ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            BUILD=0
          fi
          if [ -z "$NAME" ]; then
            NAME="0.0.0"
          fi
          # Monotonic Play versionCode: pubspec +N + run_number + optional offset
          # Ensures every CI run is unique and stays above the committed build number.
          OFFSET=${{ inputs.version_code_offset }}
          RUN_NUMBER=${{ github.run_number }}
          CODE=$(( BUILD + RUN_NUMBER + OFFSET ))
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$NAME versionCode=$CODE (pubspec_build=$BUILD run_number=$RUN_NUMBER offset=$OFFSET)"

      - name: Build Android APK (debug)
        if: ${{ inputs.artifact_type == 'apk' && inputs.build_mode == 'debug' }}
        env:
          AM_DOMAIN: ${{ inputs.am_domain }}
          AM_ENV_LABEL: ${{ inputs.am_env }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          AM_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AM_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          AM_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          AM_GROWTHBOOK_CLIENT_KEY: ${{ secrets.GROWTHBOOK_CLIENT_KEY }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${AM_DOMAIN}" ]; then EXTRA+=(--dart-define="AM_DOMAIN=${AM_DOMAIN}"); fi
          if [ -n "${AM_ENV_LABEL}" ]; then EXTRA+=(--dart-define="AM_ENV=${AM_ENV_LABEL}"); fi
          if [ -n "${AM_GOOGLE_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_CLIENT_ID=${AM_GOOGLE_CLIENT_ID}"); fi
          if [ -n "${AM_GOOGLE_IOS_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_IOS_CLIENT_ID=${AM_GOOGLE_IOS_CLIENT_ID}"); fi
          if [ -n "${AM_GOOGLE_ANDROID_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_ANDROID_CLIENT_ID=${AM_GOOGLE_ANDROID_CLIENT_ID}"); fi
          if [ -n "${AM_GROWTHBOOK_CLIENT_KEY}" ]; then EXTRA+=(--dart-define="AM_GROWTHBOOK_CLIENT_KEY=${AM_GROWTHBOOK_CLIENT_KEY}"); fi
          echo "Building debug APK with AM_DOMAIN=${AM_DOMAIN:-<unset>} AM_ENV=${AM_ENV_LABEL:-<unset>}"
          flutter build apk --debug \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Build Android APK (release)
        if: ${{ inputs.artifact_type == 'apk' && inputs.build_mode == 'release' }}
        env:
          AM_DOMAIN: ${{ inputs.am_domain }}
          AM_ENV_LABEL: ${{ inputs.am_env }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          AM_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AM_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          AM_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          AM_GROWTHBOOK_CLIENT_KEY: ${{ secrets.GROWTHBOOK_CLIENT_KEY }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${AM_DOMAIN}" ]; then EXTRA+=(--dart-define="AM_DOMAIN=${AM_DOMAIN}"); fi
          if [ -n "${AM_ENV_LABEL}" ]; then EXTRA+=(--dart-define="AM_ENV=${AM_ENV_LABEL}"); fi
          if [ -n "${AM_GOOGLE_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_CLIENT_ID=${AM_GOOGLE_CLIENT_ID}"); fi
          if [ -n "${AM_GOOGLE_IOS_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_IOS_CLIENT_ID=${AM_GOOGLE_IOS_CLIENT_ID}"); fi
          if [ -n "${AM_GOOGLE_ANDROID_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_ANDROID_CLIENT_ID=${AM_GOOGLE_ANDROID_CLIENT_ID}"); fi
          if [ -n "${AM_GROWTHBOOK_CLIENT_KEY}" ]; then EXTRA+=(--dart-define="AM_GROWTHBOOK_CLIENT_KEY=${AM_GROWTHBOOK_CLIENT_KEY}"); fi
          echo "Building release APK with AM_DOMAIN=${AM_DOMAIN:-<unset>} AM_ENV=${AM_ENV_LABEL:-<unset>}"
          flutter build apk --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Build Android App Bundle (release)
        if: ${{ inputs.artifact_type == 'appbundle' }}
        env:
          AM_DOMAIN: ${{ inputs.am_domain }}
          AM_ENV_LABEL: ${{ inputs.am_env }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          AM_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AM_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          AM_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          AM_GROWTHBOOK_CLIENT_KEY: ${{ secrets.GROWTHBOOK_CLIENT_KEY }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ -n "${AM_DOMAIN}" ]; then EXTRA+=(--dart-define="AM_DOMAIN=${AM_DOMAIN}"); fi
          if [ -n "${AM_ENV_LABEL}" ]; then EXTRA+=(--dart-define="AM_ENV=${AM_ENV_LABEL}"); fi
          if [ -n "${AM_GOOGLE_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_CLIENT_ID=${AM_GOOGLE_CLIENT_ID}"); fi
          if [ -n "${AM_GOOGLE_IOS_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_IOS_CLIENT_ID=${AM_GOOGLE_IOS_CLIENT_ID}"); fi
          if [ -n "${AM_GOOGLE_ANDROID_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_ANDROID_CLIENT_ID=${AM_GOOGLE_ANDROID_CLIENT_ID}"); fi
          if [ -n "${AM_GROWTHBOOK_CLIENT_KEY}" ]; then EXTRA+=(--dart-define="AM_GROWTHBOOK_CLIENT_KEY=${AM_GROWTHBOOK_CLIENT_KEY}"); fi
          echo "Building release AAB with AM_DOMAIN=${AM_DOMAIN:-<unset>} AM_ENV=${AM_ENV_LABEL:-<unset>}"
          flutter build appbundle --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            ${EXTRA[@]+"${EXTRA[@]}"}

      - name: Resolve artifact paths
        id: meta
        shell: bash
        run: |
          ARTIFACT_NAME="android-${{ inputs.build_mode }}-${{ github.run_id }}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

          mkdir -p "$GITHUB_WORKSPACE/android-ci-out"

          if [ "${{ inputs.artifact_type }}" = "appbundle" ]; then
            SRC=$(find build/app/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
            if [ -z "$SRC" ]; then
              echo "ERROR: No .aab found under build/app/outputs/bundle"
              find build/app/outputs -type f 2>/dev/null || true
              exit 1
            fi
            cp "$SRC" "$GITHUB_WORKSPACE/android-ci-out/"
          else
            SRC=$(find build/app/outputs/flutter-apk -name "*.apk" 2>/dev/null | head -n 1)
            if [ -z "$SRC" ]; then
              # Fallback for some Flutter layouts
              SRC=$(find build/app/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
            fi
            if [ -z "$SRC" ]; then
              echo "ERROR: No .apk found under build/app/outputs"
              find build/app/outputs -type f 2>/dev/null || true
              exit 1
            fi
            cp "$SRC" "$GITHUB_WORKSPACE/android-ci-out/"
          fi

          echo "Staged artifact(s):"
          ls -la "$GITHUB_WORKSPACE/android-ci-out"
          if [ -n "${{ inputs.package_name }}" ]; then
            echo "package_name=${{ inputs.package_name }}"
          fi

      - name: Upload Android artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ github.workspace }}/android-ci-out/
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # PREPROD - Play Internal (distribution track; backend via am_domain)
  # ============================================================
  android-preprod:
    name: Android -> Internal Testing
    needs: android-build
    if: ${{ inputs.deploy_internal || inputs.deploy_preprod }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_env_preprod || 'android-internal' }}
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android-build.outputs.artifact_name }}
          path: android-out

      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ github.workspace }}/android-out/*.aab
          tracks: internal
          status: completed

  # ============================================================
  # PROD - Play Production (main only; after Internal)
  # ============================================================
  android-prod:
    name: Android -> Production
    needs: [android-build, android-preprod]
    if: ${{ always() && (inputs.deploy_production || inputs.deploy_prod) && (needs.android-preprod.result == 'success' || needs.android-preprod.result == 'skipped') && needs.android-build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.gh_env_prod || 'android-prod' }}
    permissions:
      contents: read
    steps:
      - name: Require Internal Testing when both tracks requested
        if: ${{ (inputs.deploy_internal || inputs.deploy_preprod) && needs.android-preprod.result != 'success' }}
        run: |
          echo "::error::Play Production requires Internal Testing to succeed first"
          exit 1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android-build.outputs.artifact_name }}
          path: android-out

      - name: Upload to Google Play Production
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ github.workspace }}/android-out/*.aab
          tracks: production
          status: completed
