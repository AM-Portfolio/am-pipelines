name: Central Deployment Engine

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        description: "Env-agnostic service/image base name (e.g. am-trade-management-service)"
      working_directory:
        required: true
        type: string
        description: "Path to the service directory relative to repo root"
      language:
        required: true
        type: string
        description: "Primary language (java, python, flutter)"
      environment:
        required: true
        type: string
        description: "Target environment (dev, preprod, prod)"
      image_tag:
        required: false
        type: string
        default: "latest"
        description: "Docker image tag to deploy"
      namespace:
        required: true
        type: string
        description: "Kubernetes namespace"
      registry:
        required: false
        type: string
        default: "ghcr.io"
      gh_environment:
        required: false
        type: string
        description: "Explicit GitHub environment name for approvals"
      git_ref:
        required: false
        type: string
        default: ""
        description: "Service repo branch/tag to checkout (empty = workflow dispatch ref). Preprod feature-branch deploys."
      force_helm:
        required: false
        type: boolean
        default: false
        description: "Preprod only: allow Helm when Argo auto+selfHeal on main (otherwise refuse)"
    secrets:
      KUBECONFIG_NONPROD:
        required: false
        description: "Base64 kubeconfig for am-vps-nonprod (dev + preprod)"
      KUBECONFIG_PROD:
        required: false
        description: "Base64 kubeconfig for Contabo prod (prod only)"

jobs:
  deploy:
    name: Deploy → ${{ inputs.environment }}
    runs-on: ${{ inputs.environment == 'prod' && fromJSON('["self-hosted","linux","x64","docker","vps-prod"]') || (inputs.environment == 'preprod' && fromJSON('["self-hosted","linux","x64","docker","preprod"]') || fromJSON('["self-hosted","linux","x64","docker","dev"]')) }}
    environment: ${{ inputs.gh_environment || format('{0}-{1}', inputs.environment, inputs.service_name) }}

    steps:
      - name: Checkout Application Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.git_ref || github.ref }}

      - name: Checkout Universal Helm Chart (am-pipelines)
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Select cluster kubeconfig
        shell: bash
        env:
          KUBECONFIG_NONPROD_B64: ${{ secrets.KUBECONFIG_NONPROD }}
          KUBECONFIG_PROD_B64: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh
          am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh "${{ inputs.environment }}"

      - name: Resolve Helm release name
        id: release
        shell: bash
        env:
          INPUT_SERVICE_NAME: ${{ inputs.service_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/resolve-helm-release.sh
          chmod +x am-pipelines-repo/scripts/ci/list-kind-overlays.sh
          RELEASE=$(am-pipelines-repo/scripts/ci/resolve-helm-release.sh "$INPUT_SERVICE_NAME" "$INPUT_ENVIRONMENT")
          BASE="${INPUT_SERVICE_NAME%-preprod}"
          BASE="${BASE%-dev}"
          BASE="${BASE%-prod}"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Helm release: $RELEASE (base=$BASE env=$INPUT_ENVIRONMENT)"

      - name: Align Argo feature-branch (preprod)
        if: inputs.environment == 'preprod' && inputs.git_ref != ''
        shell: bash
        env:
          INPUT_SERVICE_NAME: ${{ steps.release.outputs.base }}
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          INPUT_DEPLOYED_BY: ${{ github.actor }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/preprod-argo-align-feature-branch.sh
          am-pipelines-repo/scripts/ci/preprod-argo-align-feature-branch.sh

      - name: Preprod Argo toggle gate
        if: inputs.environment == 'preprod'
        shell: bash
        env:
          INPUT_SERVICE_NAME: ${{ steps.release.outputs.base }}
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          INPUT_FORCE_HELM: ${{ inputs.force_helm }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/preprod-argo-gate.sh
          am-pipelines-repo/scripts/ci/preprod-argo-gate.sh

      - name: Deploy via Helm
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          RELEASE_NAME: ${{ steps.release.outputs.release }}
          IMAGE_BASE: ${{ steps.release.outputs.base }}
          REPO_OWNER_RAW: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.yaml"
          MAPPING_VALUES="$INPUT_WORKING_DIRECTORY/helm/vault-mappings.yaml"
          ENV_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.$INPUT_ENVIRONMENT.yaml"

          VALUES_ARG=()
          if [ -f "$BASE_VALUES" ]; then
            VALUES_ARG+=("-f" "$BASE_VALUES")
          fi
          if [ -f "$MAPPING_VALUES" ]; then
            VALUES_ARG+=("-f" "$MAPPING_VALUES")
          else
            echo "WARN: missing $MAPPING_VALUES — Vault CSI mappings will not be applied"
          fi
          if [ -f "$ENV_VALUES" ]; then
            VALUES_ARG+=("-f" "$ENV_VALUES")
          else
            echo "WARN: missing $ENV_VALUES"
          fi

          OVERLAY_DIR="./am-pipelines-repo/helm/overlays/nonprod-kind"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$OVERLAY_DIR/$f" ]; then
              VALUES_ARG+=("-f" "$OVERLAY_DIR/$f")
            else
              echo "WARN: missing $OVERLAY_DIR/$f"
            fi
          done < <(am-pipelines-repo/scripts/ci/list-kind-overlays.sh "$INPUT_ENVIRONMENT")

          echo "Helm values files: ${VALUES_ARG[*]:-(none beyond chart defaults)}"
          echo "[$INPUT_ENVIRONMENT] Deploying $RELEASE_NAME → $INPUT_NAMESPACE"

          REPO_OWNER=$(echo "$REPO_OWNER_RAW" | tr '[:upper:]' '[:lower:]')
          chmod +x am-pipelines-repo/scripts/ci/bump-release-image.sh
          export RELEASE_NAME NAMESPACE="$INPUT_NAMESPACE"
          export IMAGE_REGISTRY="$INPUT_REGISTRY/$REPO_OWNER"
          export IMAGE_REPOSITORY="$IMAGE_BASE"
          export IMAGE_TAG="$INPUT_IMAGE_TAG"
          export LANGUAGE="$INPUT_LANGUAGE"
          export CHART_DIR="./am-pipelines-repo/helm/universal-chart"
          # Pause Argo auto only for preprod feature-branch rolls
          if [ "$INPUT_ENVIRONMENT" = "preprod" ]; then
            export PAUSE_ARGO=true
          else
            export PAUSE_ARGO=false
          fi
          export ARGO_APP="$RELEASE_NAME"
          am-pipelines-repo/scripts/ci/bump-release-image.sh -- "${VALUES_ARG[@]}"

      - name: Verify Rollout
        shell: bash
        env:
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_NAME: ${{ steps.release.outputs.release }}
        run: |
          ns="$INPUT_NAMESPACE"
          dep="$RELEASE_NAME"
          echo "Waiting for rollout: $dep in $ns ..."

          if ! kubectl rollout status deployment/"$dep" -n "$ns" --timeout=10m; then
            echo "Rollout FAILED for $dep"
            kubectl get pods -n "$ns"
            kubectl get events -n "$ns" --sort-by='.lastTimestamp' | tail -n 20
            exit 1
          fi
          echo "$dep is healthy in $INPUT_ENVIRONMENT"

          worker="${dep}-worker"
          if kubectl get deployment/"$worker" -n "$ns" >/dev/null 2>&1; then
            echo "Waiting for companion worker rollout: $worker ..."
            if ! kubectl rollout status deployment/"$worker" -n "$ns" --timeout=10m; then
              echo "Rollout FAILED for $worker"
              kubectl get pods -n "$ns"
              kubectl get events -n "$ns" --sort-by='.lastTimestamp' | tail -n 20
              exit 1
            fi
            echo "$worker is healthy in $INPUT_ENVIRONMENT"
          fi
