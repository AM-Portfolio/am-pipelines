# Central Mobile iOS - reusable workflow
# Called by am-modern-ui/mobile-ci.yml.
#
# Build IPA + artifact always. TestFlight (internal) / App Store (production)
# gated by caller inputs (false on feature/develop/hotfix).

name: Central Mobile iOS

on:
  workflow_call:
    inputs:
      working_directory:
        description: "App directory relative to repo root (e.g. am_app)"
        required: true
        type: string
      flutter_channel:
        required: false
        type: string
        default: "stable"
      build_mode:
        description: "debug | release"
        required: false
        type: string
        default: "release"
      run_analyze:
        required: false
        type: boolean
        default: true
      run_tests:
        required: false
        type: boolean
        default: true
      upload_artifact:
        required: false
        type: boolean
        default: true
      keep_artifact:
        description: "Also upload a long-lived ios-keep-* artifact for backup / reuse"
        required: false
        type: boolean
        default: false
      deploy_internal:
        description: "Upload IPA to TestFlight (internal)"
        required: false
        type: boolean
        default: false
      deploy_production:
        description: "Submit to App Store (after TestFlight)"
        required: false
        type: boolean
        default: false
      bundle_id:
        description: "iOS bundle identifier"
        required: false
        type: string
        default: "com.asrax.aminvestment"
      gh_env_internal:
        required: false
        type: string
        default: "ios-internal"
      gh_env_prod:
        required: false
        type: string
        default: "ios-prod"
      am_domain:
        description: "Baked API host (AM_DOMAIN dart-define)"
        required: false
        type: string
        default: ""
      am_env:
        description: "Baked env label (AM_ENV): dev | preprod | prod"
        required: false
        type: string
        default: ""
      testflight_beta_group:
        description: "TestFlight beta group name (empty = all Internal groups)"
        required: false
        type: string
        default: ""
      skip_ios_build:
        description: "Skip Flutter IPA build; reuse a prior Actions artifact"
        required: false
        type: boolean
        default: false
      reuse_artifact_run_id:
        description: "Prior workflow run id that owns the IPA artifact"
        required: false
        type: string
        default: ""
      reuse_artifact_name:
        description: "Prior artifact name (e.g. ios-release-38629861487)"
        required: false
        type: string
        default: ""
      reuse_version_name:
        description: "Marketing version of the reused IPA (e.g. 2.0.0)"
        required: false
        type: string
        default: ""
      reuse_version_code:
        description: "CFBundleVersion of the reused IPA (e.g. 207)"
        required: false
        type: string
        default: ""
    secrets:
      IOS_CERTIFICATE_BASE64:
        required: false
      IOS_CERTIFICATE_PASSWORD:
        required: false
      IOS_PROVISIONING_PROFILE_BASE64:
        required: false
      IOS_KEYCHAIN_PASSWORD:
        required: false
      # PEM RSA key matching Distribution cert (or blank to generate + --create).
      # Required for ASC fetch when Apple already has a Distribution cert without a CI-held private key.
      CERTIFICATE_PRIVATE_KEY:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_BASE64:
        required: false
      GOOGLE_WEB_CLIENT_ID:
        required: false
      GOOGLE_IOS_CLIENT_ID:
        required: false
      GROWTHBOOK_CLIENT_KEY:
        required: false

jobs:
  ios-build:
    name: iOS -> Build
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name || steps.meta_reuse.outputs.artifact_name }}
      version_name: ${{ steps.version.outputs.version_name || steps.version_reuse.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code || steps.version_reuse.outputs.version_code }}

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      # --- Reuse prior IPA (no Flutter rebuild) ---
      - name: Validate reuse inputs
        if: ${{ inputs.skip_ios_build }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.reuse_artifact_run_id }}" ] || [ -z "${{ inputs.reuse_artifact_name }}" ]; then
            echo "::error::skip_ios_build requires reuse_artifact_run_id and reuse_artifact_name"
            exit 1
          fi
          if [ -z "${{ inputs.reuse_version_name }}" ] || [ -z "${{ inputs.reuse_version_code }}" ]; then
            echo "::error::skip_ios_build requires reuse_version_name and reuse_version_code (must match IPA)"
            exit 1
          fi

      - name: Download reused IPA artifact
        if: ${{ inputs.skip_ios_build }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reuse_artifact_name }}
          run-id: ${{ inputs.reuse_artifact_run_id }}
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/ios-ci-out

      - name: Stage reused version and artifact
        if: ${{ inputs.skip_ios_build }}
        id: version_reuse
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          NAME="${{ inputs.reuse_version_name }}"
          CODE="${{ inputs.reuse_version_code }}"
          IPA=$(find ios-ci-out -name "*.ipa" | head -n1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa in reused artifact ${{ inputs.reuse_artifact_name }}"
            find ios-ci-out -type f | head -50 || true
            exit 1
          fi
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TS_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "## iOS build version (reused artifact)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Marketing version | \`${NAME}\` |"
            echo "| Build number (CFBundleVersion) | \`${CODE}\` |"
            echo "| Source run | \`${{ inputs.reuse_artifact_run_id }}\` |"
            echo "| Source artifact | \`${{ inputs.reuse_artifact_name }}\` |"
            echo "| Run number | \`${{ github.run_number }}\` |"
            echo "| SHA | \`${SHORT_SHA}\` |"
            echo "| Bundle ID | \`${{ inputs.bundle_id }}\` |"
            echo "| AM_ENV | \`${{ inputs.am_env }}\` |"
            echo "| Resolved at (UTC) | \`${TS_UTC}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Reusing IPA ${NAME} (${CODE}) from run ${{ inputs.reuse_artifact_run_id }} / ${{ inputs.reuse_artifact_name }}"
          ls -la ios-ci-out

      - name: Publish reused artifact for this run
        if: ${{ inputs.skip_ios_build }}
        id: meta_reuse
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="ios-${{ inputs.build_mode }}-${{ github.run_id }}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload reused iOS artifact
        if: ${{ inputs.skip_ios_build && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta_reuse.outputs.artifact_name }}
          path: ${{ github.workspace }}/ios-ci-out/
          if-no-files-found: error
          retention-days: 14

      # --- Full Flutter IPA build ---
      - name: Checkout caller repository
        if: ${{ !inputs.skip_ios_build }}
        uses: actions/checkout@v4

      - name: Set up Flutter
        if: ${{ !inputs.skip_ios_build }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Flutter doctor
        if: ${{ !inputs.skip_ios_build }}
        run: flutter doctor -v

      - name: Disable Flutter Swift Package Manager auto-resolution
        if: ${{ !inputs.skip_ios_build }}
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve pub dependencies
        if: ${{ !inputs.skip_ios_build }}
        working-directory: ${{ github.workspace }}
        run: |
          find . -name "pubspec.yaml" -not -path "*/.*" | while read -r file; do
            dir=$(dirname "$file")
            (cd "$dir" && flutter pub get)
          done

      - name: Run code generation (build_runner)
        if: ${{ !inputs.skip_ios_build }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            dir=$(dirname "$file")
            if grep -q "build_runner" "$dir/pubspec.yaml"; then
              echo "Running build_runner in $dir..."
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
            fi
          done < <(find . -name "pubspec.yaml" -not -path "*/.*")

      - name: Inject Google Sign-In into Info.plist
        if: ${{ !inputs.skip_ios_build }}
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          PLIST="ios/Runner/Info.plist"
          if [ -z "${GOOGLE_IOS_CLIENT_ID:-}" ]; then
            echo "::warning::GOOGLE_IOS_CLIENT_ID empty — leaving Info.plist placeholders"
            exit 0
          fi
          # GIDClientID = iOS OAuth client
          /usr/libexec/PlistBuddy -c "Set :GIDClientID ${GOOGLE_IOS_CLIENT_ID}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :GIDClientID string ${GOOGLE_IOS_CLIENT_ID}" "$PLIST"
          # URL schemes: com.googleusercontent.apps.<client-id-prefix>
          IOS_SCHEME="com.googleusercontent.apps.${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          WEB_SCHEME=""
          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            WEB_SCHEME="com.googleusercontent.apps.${GOOGLE_WEB_CLIENT_ID%.apps.googleusercontent.com}"
          fi
          # Clear and rewrite CFBundleURLTypes[0].CFBundleURLSchemes
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ${IOS_SCHEME}" "$PLIST"
          if [ -n "$WEB_SCHEME" ]; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string ${WEB_SCHEME}" "$PLIST"
          fi
          echo "Injected GIDClientID and URL schemes into Info.plist"

      - name: Import signing certificate and profile
        if: ${{ !inputs.skip_ios_build }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          DEPLOY_INTERNAL: ${{ inputs.deploy_internal }}
          DEPLOY_PRODUCTION: ${{ inputs.deploy_production }}
        run: |
          set -euo pipefail
          NEED_IPA=0
          if [ "${DEPLOY_INTERNAL}" = "true" ] || [ "${DEPLOY_PRODUCTION}" = "true" ]; then
            NEED_IPA=1
          fi

          signing_fail() {
            local msg="$1"
            echo "HAS_SIGNING=0" >> "$GITHUB_ENV"
            if [ "$NEED_IPA" = "1" ]; then
              echo "::error::${msg}"
              exit 1
            fi
            echo "::warning::${msg} — continuing with unsigned build (TestFlight/App Store not requested)"
            exit 0
          }

          # Path A: pre-stored Distribution cert + provisioning profile
          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ] && [ -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "HAS_SIGNING=1" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=p12" >> "$GITHUB_ENV"
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
            CERT_PATH=$RUNNER_TEMP/build_certificate.p12
            PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "${IOS_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PROFILE_PLIST")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$PROFILE_PLIST")
            TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< "$PROFILE_PLIST" 2>/dev/null || echo "7A3JAJ4Y77")
            cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"
            # Manual App Store export — Automatic/Development signing fails with Distribution-only CI certs
            EXPORT_CI_PLIST="ios/ExportOptions.ci.plist"
            TEAM_ID="$TEAM_ID" BUNDLE_ID="$BUNDLE_ID" PROFILE_NAME="$PROFILE_NAME" EXPORT_CI_PLIST="$EXPORT_CI_PLIST" \
              python3 -c 'import os,plistlib; from pathlib import Path; Path(os.environ["EXPORT_CI_PLIST"]).write_bytes(plistlib.dumps({"method":"app-store","destination":"export","signingStyle":"manual","teamID":os.environ["TEAM_ID"],"provisioningProfiles":{os.environ["BUNDLE_ID"]:os.environ["PROFILE_NAME"]},"stripSwiftSymbols":True,"compileBitcode":False}))'
            echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
            echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
            echo "DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
            echo "EXPORT_OPTIONS_PLIST=$EXPORT_CI_PLIST" >> "$GITHUB_ENV"
            echo "OK: imported p12 + provisioning profile (team=${TEAM_ID} profile=${PROFILE_NAME})"
            exit 0
          fi

          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ] && [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::notice::IOS_CERTIFICATE_BASE64 set without IOS_PROVISIONING_PROFILE_BASE64 — trying ASC fetch with cert private key"
          fi

          # Path B: Codemagic-parity — fetch signing via App Store Connect API
          if [ -n "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ] && [ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ] && [ -n "${APP_STORE_CONNECT_API_ISSUER_ID:-}" ]; then
            echo "Fetching signing files via ASC API (Codemagic parity)"
            # PEP 668: macOS runners mark system Python as externally managed — use a venv.
            python3 -m venv "$RUNNER_TEMP/asc-venv"
            "$RUNNER_TEMP/asc-venv/bin/pip" install -q 'codemagic-cli-tools'
            export PATH="$RUNNER_TEMP/asc-venv/bin:${PATH}"
            command -v app-store-connect >/dev/null
            mkdir -p "$RUNNER_TEMP/private_keys"
            P8_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$P8_PATH"
            export APP_STORE_CONNECT_KEY_IDENTIFIER="$APP_STORE_CONNECT_API_KEY_ID"
            export APP_STORE_CONNECT_ISSUER_ID="$APP_STORE_CONNECT_API_ISSUER_ID"
            export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$P8_PATH")"

            CERT_KEY_FILE="$RUNNER_TEMP/private_keys/ios_distribution_private_key.pem"
            CERT_KEY_ARGS=()
            if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
              printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$CERT_KEY_FILE"
              CERT_KEY_ARGS=(--certificate-key="@file:${CERT_KEY_FILE}")
              echo "Using CERTIFICATE_PRIVATE_KEY secret for ASC fetch"
            elif [ -n "${IOS_CERTIFICATE_BASE64:-}" ]; then
              P12_PATH="$RUNNER_TEMP/build_certificate.p12"
              echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
              # OpenSSL 3 needs -legacy for many Apple-exported p12 files
              if openssl pkcs12 -in "$P12_PATH" -nodes -nocerts -passin "pass:${IOS_CERTIFICATE_PASSWORD:-}" -out "$CERT_KEY_FILE" 2>/dev/null \
                || openssl pkcs12 -in "$P12_PATH" -nodes -nocerts -passin "pass:${IOS_CERTIFICATE_PASSWORD:-}" -legacy -out "$CERT_KEY_FILE" 2>/dev/null; then
                if grep -q "PRIVATE KEY" "$CERT_KEY_FILE" 2>/dev/null; then
                  CERT_KEY_ARGS=(--certificate-key="@file:${CERT_KEY_FILE}")
                  echo "Extracted Distribution private key from IOS_CERTIFICATE_BASE64"
                else
                  rm -f "$CERT_KEY_FILE"
                  echo "::warning::Could not extract PRIVATE KEY from IOS_CERTIFICATE_BASE64 (wrong IOS_CERTIFICATE_PASSWORD?)"
                fi
              else
                echo "::warning::openssl could not open IOS_CERTIFICATE_BASE64 — set IOS_CERTIFICATE_PASSWORD or CERTIFICATE_PRIVATE_KEY"
              fi
            fi

            if [ ${#CERT_KEY_ARGS[@]} -eq 0 ]; then
              # Codemagic default: generate a key; --create will mint a new Distribution cert if Apple allows.
              ssh-keygen -t rsa -b 2048 -m PEM -f "$CERT_KEY_FILE" -q -N ""
              CERT_KEY_ARGS=(--certificate-key="@file:${CERT_KEY_FILE}")
              echo "::notice::No CERTIFICATE_PRIVATE_KEY / extractable p12 key — generated ephemeral RSA key for ASC --create"
            fi

            keychain initialize
            set +e
            FETCH_OUT=$(app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create "${CERT_KEY_ARGS[@]}" 2>&1)
            FETCH_RC=$?
            set -e
            echo "$FETCH_OUT"
            if [ "$FETCH_RC" -ne 0 ]; then
              signing_fail "ASC fetch-signing-files failed (rc=${FETCH_RC}). Likely: Distribution cert exists without a matching private key. Set CERTIFICATE_PRIVATE_KEY (PEM) or IOS_CERTIFICATE_BASE64+IOS_CERTIFICATE_PASSWORD+IOS_PROVISIONING_PROFILE_BASE64. See https://help.codemagic.io/articles/6381361596-why-am-i-getting-cannot-create-resource-without-certificate-private-key-during-ios-automatic-code-signing"
            fi
            keychain add-certificates
            xcode-project use-profiles
            echo "HAS_SIGNING=1" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=asc_fetch" >> "$GITHUB_ENV"
            echo "OK: ASC fetch-signing-files for ${BUNDLE_ID}"
            exit 0
          fi

          signing_fail "iOS signing unavailable. Set IOS_CERTIFICATE_BASE64 + IOS_PROVISIONING_PROFILE_BASE64, or APP_STORE_CONNECT_API_KEY_* (+ CERTIFICATE_PRIVATE_KEY)."

      - name: Resolve Flutter version
        if: ${{ !inputs.skip_ios_build }}
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//')
          RAW=${RAW//$'\r'/}
          NAME=${RAW%%+*}
          BUILD=${RAW##*+}
          if [ "$NAME" = "$RAW" ] || [ -z "$BUILD" ] || ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            BUILD=0
          fi
          if [ -z "$NAME" ]; then NAME="0.0.0"; fi
          CODE=$(( BUILD + ${{ github.run_number }} ))
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TS_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "## iOS build version"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Marketing version | \`${NAME}\` |"
            echo "| Build number (CFBundleVersion) | \`${CODE}\` |"
            echo "| pubspec | \`${RAW}\` |"
            echo "| Run number | \`${{ github.run_number }}\` |"
            echo "| SHA | \`${SHORT_SHA}\` |"
            echo "| Bundle ID | \`${{ inputs.bundle_id }}\` |"
            echo "| AM_ENV | \`${{ inputs.am_env }}\` |"
            echo "| Resolved at (UTC) | \`${TS_UTC}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::iOS version ${NAME} (${CODE}) run=${{ github.run_number }} sha=${SHORT_SHA} env=${{ inputs.am_env }} @ ${TS_UTC}"

      - name: Build iOS IPA
        if: ${{ !inputs.skip_ios_build }}
        env:
          AM_DOMAIN: ${{ inputs.am_domain }}
          AM_ENV_LABEL: ${{ inputs.am_env }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          AM_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          AM_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          AM_GROWTHBOOK_CLIENT_KEY: ${{ secrets.GROWTHBOOK_CLIENT_KEY }}
        run: |
          set -euo pipefail
          if [ -L build ] || [ -f build ]; then rm -rf build; fi
          EXTRA=()
          if [ -n "${AM_DOMAIN}" ]; then EXTRA+=(--dart-define="AM_DOMAIN=${AM_DOMAIN}"); fi
          if [ -n "${AM_ENV_LABEL}" ]; then EXTRA+=(--dart-define="AM_ENV=${AM_ENV_LABEL}"); fi
          if [ -n "${AM_GOOGLE_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_CLIENT_ID=${AM_GOOGLE_CLIENT_ID}"); fi
          if [ -n "${AM_GOOGLE_IOS_CLIENT_ID}" ]; then EXTRA+=(--dart-define="AM_GOOGLE_IOS_CLIENT_ID=${AM_GOOGLE_IOS_CLIENT_ID}"); fi
          if [ -n "${AM_GROWTHBOOK_CLIENT_KEY}" ]; then EXTRA+=(--dart-define="AM_GROWTHBOOK_CLIENT_KEY=${AM_GROWTHBOOK_CLIENT_KEY}"); fi
          EXPORT_OPTS=()
          if [ "${HAS_SIGNING:-0}" = "1" ]; then
            EXPORT_PLIST="${EXPORT_OPTIONS_PLIST:-ios/ExportOptions.plist}"
            if [ ! -f "$EXPORT_PLIST" ]; then
              EXPORT_PLIST=ios/ExportOptions.plist
            fi
            EXPORT_OPTS+=(--export-options-plist="$EXPORT_PLIST")
            TEAM="${DEVELOPMENT_TEAM:-7A3JAJ4Y77}"
            # flutter build ipa has no --xcargs; inject Manual Distribution into Release.xcconfig
            mkdir -p ios/Flutter
            {
              echo "CODE_SIGN_STYLE=Manual"
              echo "DEVELOPMENT_TEAM=${TEAM}"
              echo "CODE_SIGN_IDENTITY=Apple Distribution"
              echo "CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution"
              if [ -n "${PROFILE_UUID:-}" ]; then
                echo "PROVISIONING_PROFILE=${PROFILE_UUID}"
              fi
              if [ -n "${PROFILE_NAME:-}" ]; then
                echo "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}"
              fi
            } >> ios/Flutter/Release.xcconfig
            echo "Injected Manual Distribution signing into ios/Flutter/Release.xcconfig (team=${TEAM})"
          else
            # Unsigned only when deploy was not requested (import step fail-fasts otherwise)
            flutter build ios --no-codesign \
              --build-name="${VERSION_NAME}" \
              --build-number="${VERSION_CODE}" \
              ${EXTRA[@]+"${EXTRA[@]}"}
            mkdir -p "$GITHUB_WORKSPACE/ios-ci-out"
            # Package app for artifact (no IPA without signing)
            APP_PATH=$(find build/ios/iphoneos -name "*.app" 2>/dev/null | head -n1)
            if [ -n "$APP_PATH" ]; then
              cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ios-ci-out/"
            fi
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          flutter build ipa --release \
            --build-name="${VERSION_NAME}" \
            --build-number="${VERSION_CODE}" \
            ${EXPORT_OPTS[@]+"${EXPORT_OPTS[@]}"} \
            ${EXTRA[@]+"${EXTRA[@]}"}
          echo "UNSIGNED=0" >> "$GITHUB_ENV"

      - name: Stage IPA artifact
        if: ${{ !inputs.skip_ios_build }}
        id: meta
        shell: bash
        run: |
          ARTIFACT_NAME="ios-${{ inputs.build_mode }}-${{ github.run_id }}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/ios-ci-out"
          if [ "${UNSIGNED:-0}" != "1" ]; then
            SRC=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n1)
            if [ -z "$SRC" ]; then
              echo "ERROR: No .ipa found under build/ios/ipa"
              find build/ios -type f 2>/dev/null | head -50 || true
              exit 1
            fi
            cp "$SRC" "$GITHUB_WORKSPACE/ios-ci-out/"
          fi
          ls -la "$GITHUB_WORKSPACE/ios-ci-out"

      - name: Upload iOS artifact
        if: ${{ !inputs.skip_ios_build && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ github.workspace }}/ios-ci-out/
          if-no-files-found: error
          retention-days: 14

      # Long-lived backup for reuse (TestFlight re-upload / local install) without rebuilding
      - name: Upload iOS keep artifact (backup)
        if: ${{ !inputs.skip_ios_build && inputs.upload_artifact && inputs.keep_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-keep-${{ github.sha }}
          path: ${{ github.workspace }}/ios-ci-out/
          if-no-files-found: error
          retention-days: 90

  ios-internal:
    name: iOS -> TestFlight
    needs: ios-build
    if: ${{ inputs.deploy_internal }}
    runs-on: macos-latest
    environment: ${{ inputs.gh_env_internal }}
    permissions:
      contents: read
    steps:
      - name: Release context
        env:
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          ARTIFACT_NAME: ${{ needs.ios-build.outputs.artifact_name }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TS_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "## TestFlight release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Marketing version | \`${VERSION_NAME}\` |"
            echo "| Build number | \`${VERSION_CODE}\` |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo "| Run number | \`${{ github.run_number }}\` |"
            echo "| SHA | \`${SHORT_SHA}\` |"
            echo "| Bundle ID | \`${{ inputs.bundle_id }}\` |"
            echo "| AM_ENV | \`${{ inputs.am_env }}\` |"
            echo "| Job start (UTC) | \`${TS_UTC}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::TestFlight target ${VERSION_NAME} (${VERSION_CODE}) artifact=${ARTIFACT_NAME} sha=${SHORT_SHA}"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios-build.outputs.artifact_name }}
          path: ios-out

      - name: Write App Store Connect API key
        env:
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_BASE64:-}" ] || [ -z "${KEY_ID:-}" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_* secrets required for TestFlight"
            exit 1
          fi
          mkdir -p private_keys
          echo "$KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${KEY_ID}.p8"

      - name: Upload to TestFlight
        id: upload
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
        run: |
          set -euo pipefail
          IPA=$(find ios-out -name "*.ipa" | head -n1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA in artifact — cannot upload to TestFlight"
            exit 1
          fi
          set +e
          OUT=$(xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "upload_status=uploaded" >> "$GITHUB_OUTPUT"
            echo "::notice::altool upload succeeded for ${VERSION_NAME} (${VERSION_CODE})"
            exit 0
          fi
          if echo "$OUT" | grep -qiE 'already been used|DUPLICATE|must be higher than the previously uploaded version'; then
            echo "upload_status=already_on_asc" >> "$GITHUB_OUTPUT"
            echo "::notice::Build ${VERSION_CODE} already on ASC — continuing to wait/assign"
            exit 0
          fi
          echo "::error::altool upload failed (rc=${RC})"
          exit "$RC"

      - name: Wait for ASC processing and assign beta groups
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          BETA_GROUP_NAME: ${{ inputs.testflight_beta_group }}
          UPLOAD_STATUS: ${{ steps.upload.outputs.upload_status }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, sys, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          def b64url(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          def mint_jwt(key_id: str, issuer: str, p8_path: Path) -> str:
              import subprocess
              import tempfile

              now = int(time.time())
              header = b64url(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}, separators=(",", ":")).encode())
              payload = b64url(
                  json.dumps(
                      {"iss": issuer, "iat": now, "exp": now + 20 * 60, "aud": "appstoreconnect-v1"},
                      separators=(",", ":"),
                  ).encode()
              )
              signing_input = f"{header}.{payload}".encode()
              with tempfile.NamedTemporaryFile(suffix=".sig", delete=False) as sigf:
                  sig_path = sigf.name
              try:
                  subprocess.run(
                      ["openssl", "dgst", "-sha256", "-sign", str(p8_path), "-out", sig_path],
                      input=signing_input,
                      check=True,
                  )
                  der = Path(sig_path).read_bytes()
              finally:
                  Path(sig_path).unlink(missing_ok=True)
              # Convert DER ECDSA signature to JOSE raw r||s (64 bytes for P-256)
              # Parse SEQUENCE of two INTEGERs
              i = 0
              assert der[i] == 0x30
              i += 1
              if der[i] & 0x80:
                  i += 1 + (der[i] & 0x7F)
              else:
                  i += 1

              def read_int():
                  nonlocal i
                  assert der[i] == 0x02
                  i += 1
                  ln = der[i]
                  i += 1
                  val = der[i : i + ln]
                  i += ln
                  return val

              r = read_int().lstrip(b"\x00")
              s = read_int().lstrip(b"\x00")
              r = r.rjust(32, b"\x00")[-32:]
              s = s.rjust(32, b"\x00")[-32:]
              return f"{header}.{payload}.{b64url(r + s)}"

          def api(method: str, url: str, token: str, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      parsed = json.loads(raw) if raw else {}
                  except json.JSONDecodeError:
                      parsed = {"raw": raw}
                  return e.code, parsed

          key_id = os.environ["APP_STORE_CONNECT_API_KEY_ID"]
          issuer = os.environ["APP_STORE_CONNECT_API_ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          version_code = str(os.environ["VERSION_CODE"])
          version_name = os.environ.get("VERSION_NAME", "")
          group_filter = (os.environ.get("BETA_GROUP_NAME") or "").strip()
          upload_status = os.environ.get("UPLOAD_STATUS", "")
          p8 = Path(f"private_keys/AuthKey_{key_id}.p8")
          if not p8.is_file():
              print(f"::error::Missing API key file {p8}", file=sys.stderr)
              sys.exit(1)

          token = mint_jwt(key_id, issuer, p8)
          q = urllib.parse.urlencode({"filter[bundleId]": bundle_id, "limit": 1})
          status, apps = api("GET", f"https://api.appstoreconnect.apple.com/v1/apps?{q}", token)
          if status != 200 or not apps.get("data"):
              print(f"::error::ASC apps lookup failed status={status} body={apps}", file=sys.stderr)
              sys.exit(1)
          app_id = apps["data"][0]["id"]
          print(f"ASC app id={app_id} bundle={bundle_id}")

          build = None
          build_id = None
          deadline = time.time() + 30 * 60
          while time.time() < deadline:
              token = mint_jwt(key_id, issuer, p8)
              q = urllib.parse.urlencode(
                  {
                      "filter[app]": app_id,
                      "filter[version]": version_code,
                      "sort": "-uploadedDate",
                      "limit": 5,
                  }
              )
              status, builds = api("GET", f"https://api.appstoreconnect.apple.com/v1/builds?{q}", token)
              if status != 200:
                  print(f"::warning::builds poll status={status} body={builds}")
                  time.sleep(30)
                  continue
              rows = builds.get("data") or []
              if not rows:
                  print(f"Build {version_code} not visible yet — waiting…")
                  time.sleep(30)
                  continue
              build = rows[0]
              build_id = build["id"]
              attrs = build.get("attributes") or {}
              state = attrs.get("processingState")
              uploaded = attrs.get("uploadedDate")
              print(f"Build {version_code} id={build_id} processingState={state} uploadedDate={uploaded}")
              if state == "VALID":
                  break
              if state == "INVALID":
                  print(f"::error::ASC build {version_code} INVALID", file=sys.stderr)
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                      fh.write(f"\n### ASC build INVALID\n\n- build: `{version_code}`\n- id: `{build_id}`\n")
                  sys.exit(1)
              time.sleep(30)
          else:
              print(f"::error::Timed out waiting for build {version_code} VALID", file=sys.stderr)
              sys.exit(1)

          attrs = build.get("attributes") or {}
          # Clear export-compliance gate when still missing (common for TF assignment)
          if attrs.get("usesNonExemptEncryption") is None:
              token = mint_jwt(key_id, issuer, p8)
              st, patched = api(
                  "PATCH",
                  f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}",
                  token,
                  {
                      "data": {
                          "type": "builds",
                          "id": build_id,
                          "attributes": {"usesNonExemptEncryption": False},
                      }
                  },
              )
              print(f"Export compliance PATCH status={st}")
              # 200/204 success; 409 = already set. Anything else leaves Missing Compliance.
              if st not in (200, 204, 409):
                  print(
                      f"::error::Export compliance PATCH failed status={st} body={patched}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              token = mint_jwt(key_id, issuer, p8)
              st2, builds2 = api(
                  "GET",
                  f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}",
                  token,
              )
              enc = ((builds2.get("data") or {}).get("attributes") or {}).get(
                  "usesNonExemptEncryption"
              )
              if enc is None:
                  print(
                      "::error::Export compliance still unset after PATCH — "
                      "ASC will show Missing Compliance",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              attrs["usesNonExemptEncryption"] = enc

          token = mint_jwt(key_id, issuer, p8)
          q = urllib.parse.urlencode({"filter[app]": app_id, "limit": 50})
          status, groups = api("GET", f"https://api.appstoreconnect.apple.com/v1/betaGroups?{q}", token)
          if status != 200:
              print(f"::error::betaGroups list failed status={status} body={groups}", file=sys.stderr)
              sys.exit(1)

          # ASC: Internal groups cannot be linked via relationships/builds (422
          # "Cannot add internal group to a build"). After VALID + export compliance,
          # Internal Testers get the build automatically. External groups need POST.
          assigned = []
          for g in groups.get("data") or []:
              gattrs = g.get("attributes") or {}
              name = gattrs.get("name") or ""
              is_internal = bool(gattrs.get("isInternalGroup"))
              if group_filter:
                  if name != group_filter:
                      continue
              elif not is_internal:
                  continue
              if is_internal:
                  assigned.append(f"{name} (internal — auto after VALID)")
                  print(
                      f"Internal group '{name}' receives VALID builds automatically "
                      "(ASC forbids API assign to internal groups)"
                  )
                  continue
              gid = g["id"]
              token = mint_jwt(key_id, issuer, p8)
              st, body = api(
                  "POST",
                  f"https://api.appstoreconnect.apple.com/v1/betaGroups/{gid}/relationships/builds",
                  token,
                  {"data": [{"type": "builds", "id": build_id}]},
              )
              # 204/201 success; 409 already linked is OK
              if st in (200, 201, 204, 409):
                  assigned.append(f"{name} (external)")
                  print(f"Assigned build {version_code} → beta group '{name}' (status={st})")
              else:
                  print(f"::warning::Failed to assign group '{name}' status={st} body={body}")

          if not assigned:
              print(
                  "::error::No TestFlight beta groups found "
                  f"(filter={group_filter or 'all Internal'}). Create an Internal group in ASC.",
                  file=sys.stderr,
              )
              sys.exit(1)

          summary = [
              "",
              "### ASC / TestFlight assignment",
              "",
              f"- Marketing version: `{version_name}`",
              f"- Build number: `{version_code}`",
              f"- ASC build id: `{build_id}`",
              f"- uploadedDate: `{attrs.get('uploadedDate')}`",
              f"- processingState: `{attrs.get('processingState')}`",
              f"- altool: `{upload_status}`",
              f"- Beta groups: {', '.join(f'`{a}`' for a in assigned)}",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(summary) + "\n")
          print(
              f"::notice::TestFlight ready {version_name} ({version_code}) "
              f"uploaded={attrs.get('uploadedDate')} groups={', '.join(assigned)}"
          )
          PY

  ios-prod:
    name: iOS -> App Store
    needs: [ios-build, ios-internal]
    if: ${{ always() && inputs.deploy_production && (needs.ios-internal.result == 'success' || needs.ios-internal.result == 'skipped') && needs.ios-build.result == 'success' }}
    runs-on: macos-latest
    environment: ${{ inputs.gh_env_prod }}
    permissions:
      contents: read
    steps:
      - name: Require TestFlight when both tracks requested
        if: ${{ inputs.deploy_internal && needs.ios-internal.result != 'success' }}
        run: |
          echo "::error::App Store submit requires TestFlight upload to succeed first"
          exit 1

      - name: Release context
        env:
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
          ARTIFACT_NAME: ${{ needs.ios-build.outputs.artifact_name }}
          TF_RESULT: ${{ needs.ios-internal.result }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TS_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "## App Store release"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Marketing version | \`${VERSION_NAME}\` |"
            echo "| Build number | \`${VERSION_CODE}\` |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
            echo "| TestFlight job | \`${TF_RESULT}\` |"
            echo "| Run number | \`${{ github.run_number }}\` |"
            echo "| SHA | \`${SHORT_SHA}\` |"
            echo "| Bundle ID | \`${{ inputs.bundle_id }}\` |"
            echo "| AM_ENV | \`${{ inputs.am_env }}\` |"
            echo "| Job start (UTC) | \`${TS_UTC}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::App Store gate ${VERSION_NAME} (${VERSION_CODE}) tf=${TF_RESULT} sha=${SHORT_SHA}"

      - name: Skip re-upload when TestFlight already delivered binary
        if: ${{ needs.ios-internal.result == 'success' }}
        env:
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "### Submit status"
            echo ""
            echo "Binary already on App Store Connect as \`${VERSION_NAME}\` (\`${VERSION_CODE}\`) from TestFlight."
            echo "ios-prod environment approved. Submit for Review in App Store Connect when processing completes."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Skipped App Store altool re-upload — ${VERSION_NAME} (${VERSION_CODE}) already on ASC via TestFlight"

      - name: Download build artifact
        if: ${{ needs.ios-internal.result != 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ios-build.outputs.artifact_name }}
          path: ios-out

      - name: Write App Store Connect API key
        if: ${{ needs.ios-internal.result != 'success' }}
        env:
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p private_keys
          echo "$KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${KEY_ID}.p8"

      - name: Submit to App Store
        if: ${{ needs.ios-internal.result != 'success' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          VERSION_NAME: ${{ needs.ios-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.ios-build.outputs.version_code }}
        run: |
          set -euo pipefail
          IPA=$(find ios-out -name "*.ipa" | head -n1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA in artifact — cannot submit to App Store"
            exit 1
          fi
          set +e
          OUT=$(xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "::notice::IPA uploaded for App Store processing (Environment ios-prod approved)"
            echo "### Submit status"$'\n'"altool upload succeeded for \`${VERSION_NAME}\` (\`${VERSION_CODE}\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if echo "$OUT" | grep -qiE 'already been used|DUPLICATE|must be higher than the previously uploaded version'; then
            echo "::notice::Build ${VERSION_CODE} already on ASC — treating App Store submit as success"
            {
              echo ""
              echo "### Submit status"
              echo ""
              echo "ASC reported duplicate \`cfBundleVersion\` for \`${VERSION_NAME}\` (\`${VERSION_CODE}\`) — already uploaded."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::App Store altool upload failed (rc=${RC})"
          exit "$RC"
