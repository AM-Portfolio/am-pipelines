name: Central Build & Publish

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
        description: "The primary language of the project (e.g., java, python, node, react)"
      working_directory:
        required: true
        type: string
        description: "The base directory of the sub-component relative to repo root"
      image_name:
        required: false
        type: string
        description: "Name of the Docker image to build, if applicable"
      registry:
        required: false
        type: string
        default: "ghcr.io"
        description: "Container registry to push to"
      build_context:
        required: false
        type: string
        default: "."
        description: "Docker build context relative to working_directory"
      preprod_namespace:
        required: false
        type: string
        default: "am-apps-preprod"
        description: "Kubernetes namespace for preprod"
      dev_namespace:
        required: false
        type: string
        default: "am-apps-dev"
        description: "Kubernetes namespace for development"
      prod_namespace:
        required: false
        type: string
        default: "am-apps-prod"
        description: "Kubernetes namespace for prod"
      deploy_dev:
        required: false
        type: boolean
        default: true
        description: "Set to true to enable the dev deployment stage automatically"
      deploy_prod:
        required: false
        type: boolean
        default: true
        description: "Set to true to enable the prod deployment stage (parallel with preprod)"
      deploy_preprod:
        required: false
        type: boolean
        default: true
        description: >-
          Helm roll to Kind preprod (release = image_name-preprod + Kind Vault overlays).
          On main/master this is skipped when gitops_write_preprod is true (Argo owns the roll)
          unless force_preprod_helm is set. Feature branches always Helm when this is true.
      force_preprod_helm:
        required: false
        type: boolean
        default: false
        description: >-
          Preprod only: run Helm on main/master even when gitops_write_preprod is true,
          and allow Helm while Argo Auto-Sync is on (selfHeal may revert values).
      skip_security_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal security scans (set true when caller already ran a shared security gate)"
      skip_secrets_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal secrets scan (TruffleHog)"
      skip_iac_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal IaC configuration scan (Checkov)"
      skip_vulnerability_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal Docker image vulnerability scan (Trivy)"
      gh_env_dev:
        required: false
        type: string
        description: "Explicit GitHub environment name for dev deployment approval"
      gh_env_preprod:
        required: false
        type: string
        description: "Explicit GitHub environment name for preprod deployment approval"
      gh_env_prod:
        required: false
        type: string
        description: "Explicit GitHub environment name for prod deployment approval"
      no_cache:
        required: false
        type: boolean
        default: false
        description: "Force Docker to build without using cache"
      gitops_write_preprod:
        required: false
        type: boolean
        # Default on: every main/master build bumps am-gitops so Argo preprod tracks the new image.
        # Still gated by job if: only runs on main/master. Set false to opt out.
        default: true
        description: "Auto-commit image tag/digest to AM-Portfolio/am-gitops preprod/image-tags (Argo). Default true. Needs GITHUB_PAT with contents:write on am-gitops."
      gitops_values_repo:
        required: false
        type: string
        default: ""
        description: "Service values repo URL for freeze (default: caller github.repository)"
      gitops_values_path:
        required: false
        type: string
        default: ""
        description: "Path under values repo to helm/ (default: working_directory)"
    secrets:
      KUBECONFIG_NONPROD:
        required: false
        description: "Base64 kubeconfig for am-vps-nonprod (dev + preprod Helm rolls)"
      KUBECONFIG_PROD:
        required: false
        description: "Base64 kubeconfig for Contabo prod cluster (prod Helm rolls only)"

jobs:
  # ============================================================
  # SECURITY SCAN — GitHub-hosted runner
  # Scans for secrets (tokens, keys) using TruffleHog OSS
  # ============================================================
  security-scan:
    name: Security Scan (Secrets)
    # Skip when caller already ran a shared security gate (e.g. unified-ci.yml)
    if: ${{ !inputs.skip_security_scan && !inputs.skip_secrets_scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog needs history to find leaks

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          extra_args: --only-verified

  # ============================================================
  # MISCONFIG SCAN (IaC) — GitHub-hosted runner
  # Scans Helm charts and Terraform for security misconfigurations
  # ============================================================
  misconfig-scan:
    name: Security Scan (IaC)
    # Skip when caller already ran a shared security gate (e.g. unified-ci.yml)
    if: ${{ !inputs.skip_security_scan && !inputs.skip_iac_scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./
          framework: helm,terraform,kubernetes
          soft_fail: true # Set to true to avoid blocking the workflow
          quiet: true
          output_format: cli,sarif
          download_external_modules: true
          log_level: ERROR

  # ============================================================
  # BUILD — GitHub-hosted runner
  # Compiles, tests, builds and pushes Docker image to GHCR
  # ============================================================
  build:
    name: Build & Push
    needs: [security-scan, misconfig-scan]
    # Run when security jobs succeeded OR were intentionally skipped by caller
    if: |
      always() &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.push.outputs.tag }}
      image_repository: ${{ steps.push.outputs.repository }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────
      - name: Set up JDK
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Create Maven settings.xml
        if: ${{ inputs.language == 'java' }}
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build Java Package
        if: ${{ inputs.language == 'java' }}
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MODULE="${{ inputs.working_directory }}"
          ROOT_POM="${{ github.workspace }}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE" != "." ] && grep -Fq "<module>${MODULE}</module>" "$ROOT_POM"; then
            echo "Monorepo reactor build: -pl ${MODULE} -am"
            mvn -B -f "$ROOT_POM" clean package -pl "$MODULE" -am -DskipTests
          else
            mvn -B -f "${{ github.workspace }}/${MODULE}/pom.xml" clean package -DskipTests
          fi

      - name: Run Java Tests
        if: ${{ inputs.language == 'java' }}
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          MODULE="${{ inputs.working_directory }}"
          ROOT_POM="${{ github.workspace }}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE" != "." ] && grep -Fq "<module>${MODULE}</module>" "$ROOT_POM"; then
            mvn -B -f "$ROOT_POM" test -pl "$MODULE" -am || echo "Test step failed or skipped"
          else
            mvn -B -f "${{ github.workspace }}/${MODULE}/pom.xml" test || echo "Test step failed or skipped"
          fi

      # ── Python ────────────────────────────────────────────
      - name: Set up Python
        if: ${{ inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        if: ${{ inputs.language == 'python' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python Tests
        if: ${{ inputs.language == 'python' }}
        run: |
          pip install pytest flake8
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          pytest || echo "Tests failed or not found - marking as skipped for now"

      # ── Node.js / React ───────────────────────────────────
      - name: Set up Node.js
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ inputs.working_directory }}/package-lock.json"

      - name: Install Node Dependencies
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm ci

      - name: Build Node/React Application
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm run build --if-present

      - name: Run Node Tests
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm test --if-present

      # ── Docker ────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.image_name != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          # GHCR_TOKEN is an org-level PAT with read:packages scope, passed via
          # secrets: inherit. Enables cross-repo pulls (e.g. am-python-base from
          # am-market). Falls back to GITHUB_TOKEN for same-repo package access.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: push
        if: ${{ inputs.image_name != '' }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_ID=${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image_name }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          BASE_REG="ghcr.io/${{ github.repository_owner }}/"
          BASE_REG=$(echo $BASE_REG | tr '[A-Z]' '[a-z]')
          TAG="${{ github.run_id }}"

          echo "Building $IMAGE_ID ..."
          CACHE_ARG=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            CACHE_ARG="--no-cache"
          fi

          docker build $CACHE_ARG -f Dockerfile \
            --build-arg BASE_REGISTRY=$BASE_REG \
            --build-arg GITHUB_PACKAGES_USERNAME=${{ github.actor }} \
            --build-arg GITHUB_PACKAGES_TOKEN=${GHCR_TOKEN} \
            --build-arg BUILD_ID=${{ github.run_id }} \
            -t $IMAGE_ID:$TAG \
            -t $IMAGE_ID:latest \
            ${{ inputs.build_context }}

          echo "Pushing $IMAGE_ID ..."
          docker push $IMAGE_ID:$TAG
          docker push $IMAGE_ID:latest

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_ID:$TAG" | awk -F@ '{print $2}')
          echo "repository=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # ============================================================
  # GITOPS — auto-commit preprod image-tags to am-gitops (Argo)
  # Requires org GITHUB_PAT (or GHCR_TOKEN) with contents:write on am-gitops.
  # ============================================================
  gitops-preprod:
    name: GitOps → Preprod image-tags
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.image_name != '' &&
      (inputs.gitops_write_preprod == true || inputs.deploy_preprod == true) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    permissions:
      contents: read
    steps:
      - name: Checkout am-gitops
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-gitops
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          path: am-gitops

      - name: Resolve chart SHA
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api repos/AM-Portfolio/am-pipelines/commits/main --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Write freeze + image-tags
        env:
          SVC: ${{ inputs.image_name }}
          DIGEST: ${{ needs.build.outputs.image_digest }}
          TAG: ${{ needs.build.outputs.image_tag }}
          REPO: ${{ needs.build.outputs.image_repository }}
          CHART_SHA: ${{ steps.chart.outputs.sha }}
          SOURCE_SHA: ${{ github.sha }}
          VALUES_REPO_INPUT: ${{ inputs.gitops_values_repo }}
          VALUES_PATH_INPUT: ${{ inputs.gitops_values_path }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VALUES_REPO="${VALUES_REPO_INPUT:-https://github.com/${GITHUB_REPOSITORY}.git}"
          VALUES_PATH="${VALUES_PATH_INPUT:-${WORKING_DIRECTORY}}"
          mkdir -p "am-gitops/releases/preprod" "am-gitops/preprod/image-tags"
          {
            echo "# CI-written freeze — do not hand-edit for enrolled services"
            echo "image:"
            echo "  repository: ${REPO}"
            echo "  digest: ${DIGEST}"
            echo "  tag: \"${TAG}\""
            echo "chart:"
            echo "  repoURL: https://github.com/AM-Portfolio/am-pipelines.git"
            echo "  path: helm/universal-chart"
            echo "  targetRevision: \"${CHART_SHA}\""
            echo "values:"
            echo "  repoURL: ${VALUES_REPO}"
            echo "  targetRevision: \"${SOURCE_SHA}\""
            echo "  files:"
            echo "    - ${VALUES_PATH}/helm/values.yaml"
            echo "    - ${VALUES_PATH}/helm/vault-mappings.yaml"
            echo "    - ${VALUES_PATH}/helm/values.preprod.yaml"
            echo "sourceCommit: \"${SOURCE_SHA}\""
          } > "am-gitops/releases/preprod/${SVC}.yaml"
          {
            echo "# Synced from releases/preprod/${SVC}.yaml (CI auto-commit)"
            echo "global:"
            echo "  image:"
            if [ -n "${DIGEST}" ]; then
              echo "    digest: \"${DIGEST}\""
            fi
            echo "    tag: \"${TAG}\""
            echo "    imagePullSecrets:"
            echo "      - name: ghcr-creds"
          } > "am-gitops/preprod/image-tags/${SVC}.yaml"

      - name: Commit and push
        working-directory: am-gitops
        env:
          SVC: ${{ inputs.image_name }}
          DIGEST: ${{ needs.build.outputs.image_digest }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name "am-gitops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/preprod/${SVC}.yaml" "preprod/image-tags/${SVC}.yaml"
          if git diff --cached --quiet; then
            echo "No gitops changes"
            exit 0
          fi
          git commit -m "freeze(preprod/${SVC}): ${TAG}"
          git push origin HEAD:main

  # ============================================================
  # VULNERABILITY SCAN — GitHub-hosted runner
  # Scans the built Docker image for CVEs
  # ============================================================
  vulnerability-scan:
    name: Security Scan (Vulnerabilities)
    needs: build
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      !inputs.skip_security_scan &&
      !inputs.skip_vulnerability_scan
    permissions:
      contents: read
      packages: read
    steps:
      - name: Lowercase Image Ref
        id: image
        run: |
          ref="ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ github.run_id }}"
          echo "ref=$(echo $ref | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Non-blocking (reports but continues)

  # ============================================================
  # DEPLOY — DEV (am-vps-nonprod / am-apps-dev)
  # Runner label: "dev" (Kind nonprod host). kubeconfig via KUBECONFIG_NONPROD.
  # ============================================================
  deploy-dev:
    name: Deploy → Dev
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    # Proceed when security jobs succeeded OR were intentionally skipped by caller
    if: |
      always() &&
      inputs.image_name != '' && inputs.deploy_dev == true &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    # Kind nonprod runner is registered with label "dev" (and often "preprod").
    runs-on: [self-hosted, linux, x64, docker, dev]
    environment: ${{ inputs.gh_env_dev || format('dev-{0}', inputs.image_name) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate Helm Configuration
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          if [ ! -f "$INPUT_WORKING_DIRECTORY/helm/values.yaml" ]; then
            echo "❌ REQUIRED file missing: $INPUT_WORKING_DIRECTORY/helm/values.yaml"
            echo "Deployment cannot proceed without a base values file."
            exit 1
          fi

      - name: Checkout Universal Helm Chart
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          clean: true

      - name: Select nonprod cluster kubeconfig
        shell: bash
        env:
          KUBECONFIG_NONPROD_B64: ${{ secrets.KUBECONFIG_NONPROD }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh
          am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh dev

      - name: Resolve Dev release name
        id: release_dev
        shell: bash
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/resolve-helm-release.sh
          chmod +x am-pipelines-repo/scripts/ci/list-kind-overlays.sh
          RELEASE=$(am-pipelines-repo/scripts/ci/resolve-helm-release.sh "$INPUT_IMAGE_NAME" dev)
          BASE="${INPUT_IMAGE_NAME%-preprod}"
          BASE="${BASE%-dev}"
          BASE="${BASE%-prod}"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Dev Helm release: $RELEASE"

      - name: Deploy to Dev via Helm
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          INPUT_DEV_NAMESPACE: ${{ inputs.dev_namespace }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          RELEASE_NAME: ${{ steps.release_dev.outputs.release }}
          IMAGE_BASE: ${{ steps.release_dev.outputs.base }}
          REPO_OWNER_RAW: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BASE_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.yaml"
          MAPPING_VALUES="$INPUT_WORKING_DIRECTORY/helm/vault-mappings.yaml"
          ENV_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.dev.yaml"

          VALUES_ARG=()
          if [ -f "$BASE_VALUES" ]; then
            VALUES_ARG+=("-f" "$BASE_VALUES")
          fi
          if [ -f "$MAPPING_VALUES" ]; then
            VALUES_ARG+=("-f" "$MAPPING_VALUES")
          fi
          if [ -f "$ENV_VALUES" ]; then
            VALUES_ARG+=("-f" "$ENV_VALUES")
          fi

          OVERLAY_DIR="./am-pipelines-repo/helm/overlays/nonprod-kind"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$OVERLAY_DIR/$f" ]; then
              VALUES_ARG+=("-f" "$OVERLAY_DIR/$f")
            else
              echo "WARN: missing $OVERLAY_DIR/$f"
            fi
          done < <(am-pipelines-repo/scripts/ci/list-kind-overlays.sh dev)

          echo "🚀 [DEV] Deploying $RELEASE_NAME → $INPUT_DEV_NAMESPACE"
          REPO_OWNER=$(echo "$REPO_OWNER_RAW" | tr '[:upper:]' '[:lower:]')

          if helm status "$RELEASE_NAME" --namespace "$INPUT_DEV_NAMESPACE" >/dev/null 2>&1; then
            echo "Existing release — helm --reuse-values + image tag only"
            helm upgrade "$RELEASE_NAME" ./am-pipelines-repo/helm/universal-chart \
              --namespace "$INPUT_DEV_NAMESPACE" \
              --reuse-values \
              --set global.image.registry="$INPUT_REGISTRY/$REPO_OWNER" \
              --set global.image.repository="$IMAGE_BASE" \
              --set global.image.tag="$RUN_ID" \
              --set global.image.pullPolicy="Always"
          else
            echo "Helm values files: ${VALUES_ARG[*]}"
            helm upgrade --install "$RELEASE_NAME" ./am-pipelines-repo/helm/universal-chart \
              --namespace "$INPUT_DEV_NAMESPACE" \
              --create-namespace \
              --set global.image.registry="$INPUT_REGISTRY/$REPO_OWNER" \
              --set global.image.repository="$IMAGE_BASE" \
              --set global.image.tag="$RUN_ID" \
              --set global.image.pullPolicy="Always" \
              --set language="$INPUT_LANGUAGE" \
              "${VALUES_ARG[@]}"
          fi

      - name: Verify Dev Rollout
        shell: bash
        env:
          INPUT_DEV_NAMESPACE: ${{ inputs.dev_namespace }}
          RELEASE_NAME: ${{ steps.release_dev.outputs.release }}
        run: |
          ns="$INPUT_DEV_NAMESPACE"
          dep="$RELEASE_NAME"
          echo "⏳ Waiting for rollout: $dep in $ns ..."

          if ! kubectl rollout status deployment/"$dep" -n "$ns" --timeout=10m; then
            echo "❌ Rollout FAILED for $dep"
            kubectl get pods -n "$ns"
            kubectl get events -n "$ns" --sort-by='.lastTimestamp' | tail -n 20
            exit 1
          fi
          echo "✅ $dep is healthy in dev"

  # ============================================================
  # DEPLOY — PREPROD (Kind / am-apps-preprod) via Helm
  # Release must be image_name-preprod (matches Argo). Kind Vault =
  # vault-preprod.asrax.in. On main, prefer gitops_write_preprod (Argo);
  # set force_preprod_helm to Helm anyway.
  # ============================================================
  deploy-preprod:
    name: Deploy → Preprod
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    runs-on: [self-hosted, linux, x64, docker, preprod]
    if: |
      always() &&
      inputs.image_name != '' && inputs.deploy_preprod == true &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (
        inputs.force_preprod_helm == true ||
        inputs.gitops_write_preprod != true ||
        (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master')
      )
    environment: ${{ inputs.gh_env_preprod || format('preprod-{0}', inputs.image_name) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout Universal Helm Chart
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          clean: true

      - name: Select nonprod cluster kubeconfig
        shell: bash
        env:
          KUBECONFIG_NONPROD_B64: ${{ secrets.KUBECONFIG_NONPROD }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh
          am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh preprod

      - name: Resolve preprod release name
        id: release
        shell: bash
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/resolve-helm-release.sh
          chmod +x am-pipelines-repo/scripts/ci/list-kind-overlays.sh
          RELEASE=$(am-pipelines-repo/scripts/ci/resolve-helm-release.sh "$INPUT_IMAGE_NAME" preprod)
          BASE="${INPUT_IMAGE_NAME%-preprod}"
          BASE="${BASE%-dev}"
          BASE="${BASE%-prod}"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Preprod Helm release: $RELEASE"

      - name: Align Argo feature-branch (preprod)
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
        shell: bash
        env:
          INPUT_SERVICE_NAME: ${{ steps.release.outputs.base }}
          INPUT_GIT_REF: ${{ github.ref_name }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/preprod-argo-align-feature-branch.sh
          am-pipelines-repo/scripts/ci/preprod-argo-align-feature-branch.sh

      - name: Preprod Argo toggle gate
        shell: bash
        env:
          INPUT_SERVICE_NAME: ${{ steps.release.outputs.base }}
          INPUT_GIT_REF: ${{ github.ref_name }}
          INPUT_FORCE_HELM: ${{ inputs.force_preprod_helm }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/preprod-argo-gate.sh
          am-pipelines-repo/scripts/ci/preprod-argo-gate.sh

      - name: Deploy to Preprod via Helm
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          INPUT_PREPROD_NAMESPACE: ${{ inputs.preprod_namespace }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          RELEASE_NAME: ${{ steps.release.outputs.release }}
          IMAGE_BASE: ${{ steps.release.outputs.base }}
          REPO_OWNER_RAW: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BASE_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.yaml"
          MAPPING_VALUES="$INPUT_WORKING_DIRECTORY/helm/vault-mappings.yaml"
          ENV_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.preprod.yaml"

          VALUES_ARG=()
          if [ -f "$BASE_VALUES" ]; then
            VALUES_ARG+=("-f" "$BASE_VALUES")
          fi
          if [ -f "$MAPPING_VALUES" ]; then
            VALUES_ARG+=("-f" "$MAPPING_VALUES")
          else
            echo "WARN: missing $MAPPING_VALUES — Vault CSI mappings will not be applied"
          fi
          if [ -f "$ENV_VALUES" ]; then
            VALUES_ARG+=("-f" "$ENV_VALUES")
          else
            echo "WARN: missing $ENV_VALUES"
          fi

          OVERLAY_DIR="./am-pipelines-repo/helm/overlays/nonprod-kind"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$OVERLAY_DIR/$f" ]; then
              VALUES_ARG+=("-f" "$OVERLAY_DIR/$f")
            else
              echo "WARN: missing $OVERLAY_DIR/$f"
            fi
          done < <(am-pipelines-repo/scripts/ci/list-kind-overlays.sh preprod)

          echo "🚀 [PREPROD] Deploying $RELEASE_NAME → $INPUT_PREPROD_NAMESPACE (image tag=$RUN_ID)"
          REPO_OWNER=$(echo "$REPO_OWNER_RAW" | tr '[:upper:]' '[:lower:]')

          if helm status "$RELEASE_NAME" --namespace "$INPUT_PREPROD_NAMESPACE" >/dev/null 2>&1; then
            echo "Existing release — helm --reuse-values + image tag only"
            helm upgrade "$RELEASE_NAME" ./am-pipelines-repo/helm/universal-chart \
              --namespace "$INPUT_PREPROD_NAMESPACE" \
              --reuse-values \
              --set global.image.registry="$INPUT_REGISTRY/$REPO_OWNER" \
              --set global.image.repository="$IMAGE_BASE" \
              --set global.image.tag="$RUN_ID" \
              --set global.image.pullPolicy="Always"
          else
            echo "Helm values files: ${VALUES_ARG[*]}"
            helm upgrade --install "$RELEASE_NAME" ./am-pipelines-repo/helm/universal-chart \
              --namespace "$INPUT_PREPROD_NAMESPACE" \
              --create-namespace \
              --set global.image.registry="$INPUT_REGISTRY/$REPO_OWNER" \
              --set global.image.repository="$IMAGE_BASE" \
              --set global.image.tag="$RUN_ID" \
              --set global.image.pullPolicy="Always" \
              --set language="$INPUT_LANGUAGE" \
              "${VALUES_ARG[@]}"
          fi

      - name: Verify Preprod Rollout
        shell: bash
        env:
          INPUT_PREPROD_NAMESPACE: ${{ inputs.preprod_namespace }}
          RELEASE_NAME: ${{ steps.release.outputs.release }}
        run: |
          ns="$INPUT_PREPROD_NAMESPACE"
          dep="$RELEASE_NAME"
          echo "⏳ Waiting for rollout: $dep in $ns ..."

          if ! kubectl rollout status deployment/"$dep" -n "$ns" --timeout=10m; then
            echo "❌ Rollout FAILED for $dep"
            kubectl get pods -n "$ns" -l "app.kubernetes.io/instance=$dep" -o wide || true
            kubectl get events -n "$ns" --field-selector "involvedObject.name=$dep" --sort-by='.lastTimestamp' | tail -n 20 || true
            exit 1
          fi
          echo "✅ $dep is healthy in preprod"

      - name: Diagnostics on Failure
        if: failure()
        shell: bash
        env:
          INPUT_PREPROD_NAMESPACE: ${{ inputs.preprod_namespace }}
          RELEASE_NAME: ${{ steps.release.outputs.release }}
        run: |
          echo "🔍 Preprod deployment failed. Diagnostics:"
          kubectl get pods -n "$INPUT_PREPROD_NAMESPACE" -o wide
          kubectl describe deployment/"$RELEASE_NAME" -n "$INPUT_PREPROD_NAMESPACE" 2>&1 | tail -n 40
          POD=$(kubectl get pods -n "$INPUT_PREPROD_NAMESPACE" -l "app.kubernetes.io/instance=$RELEASE_NAME" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            kubectl describe pod "$POD" -n "$INPUT_PREPROD_NAMESPACE" 2>&1 | tail -n 50
          fi

  # ============================================================
  # DEPLOY — PROD (Contabo / am-apps-prod only)
  # Prefer runners labeled vps-prod; kubeconfig via KUBECONFIG_PROD
  # ============================================================
  deploy-prod:
    name: Deploy → Prod
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    runs-on: [self-hosted, linux, x64, docker, vps-prod]
    # Proceed when security jobs succeeded OR were intentionally skipped by caller
    if: |
      always() &&
      inputs.image_name != '' && inputs.deploy_prod == true &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    environment: ${{ inputs.gh_env_prod || format('prod-{0}', inputs.image_name) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout Universal Helm Chart
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          clean: true

      - name: Select prod cluster kubeconfig
        shell: bash
        env:
          KUBECONFIG_PROD_B64: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh
          am-pipelines-repo/scripts/ci/select-cluster-kubeconfig.sh prod

      - name: Resolve Prod release name
        id: release_prod
        shell: bash
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          chmod +x am-pipelines-repo/scripts/ci/resolve-helm-release.sh
          RELEASE=$(am-pipelines-repo/scripts/ci/resolve-helm-release.sh "$INPUT_IMAGE_NAME" prod)
          BASE="${INPUT_IMAGE_NAME%-preprod}"
          BASE="${BASE%-dev}"
          BASE="${BASE%-prod}"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Prod Helm release: $RELEASE (bare — no Kind overlays)"

      - name: Deploy to Prod via Helm
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          INPUT_PROD_NAMESPACE: ${{ inputs.prod_namespace }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_LANGUAGE: ${{ inputs.language }}
          RELEASE_NAME: ${{ steps.release_prod.outputs.release }}
          IMAGE_BASE: ${{ steps.release_prod.outputs.base }}
          REPO_OWNER_RAW: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BASE_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.yaml"
          MAPPING_VALUES="$INPUT_WORKING_DIRECTORY/helm/vault-mappings.yaml"
          ENV_VALUES="$INPUT_WORKING_DIRECTORY/helm/values.prod.yaml"

          VALUES_ARG=()
          if [ -f "$BASE_VALUES" ]; then
            VALUES_ARG+=("-f" "$BASE_VALUES")
          fi
          if [ -f "$MAPPING_VALUES" ]; then
            VALUES_ARG+=("-f" "$MAPPING_VALUES")
          fi
          if [ -f "$ENV_VALUES" ]; then
            VALUES_ARG+=("-f" "$ENV_VALUES")
          fi

          echo "🚀 [PROD] Deploying $RELEASE_NAME → $INPUT_PROD_NAMESPACE"
          REPO_OWNER=$(echo "$REPO_OWNER_RAW" | tr '[:upper:]' '[:lower:]')

          if helm status "$RELEASE_NAME" --namespace "$INPUT_PROD_NAMESPACE" >/dev/null 2>&1; then
            echo "Existing release — helm --reuse-values + image tag only"
            helm upgrade "$RELEASE_NAME" ./am-pipelines-repo/helm/universal-chart \
              --namespace "$INPUT_PROD_NAMESPACE" \
              --reuse-values \
              --set global.image.registry="$INPUT_REGISTRY/$REPO_OWNER" \
              --set global.image.repository="$IMAGE_BASE" \
              --set global.image.tag="$RUN_ID" \
              --set global.image.pullPolicy="Always"
          else
            helm upgrade --install "$RELEASE_NAME" ./am-pipelines-repo/helm/universal-chart \
              --namespace "$INPUT_PROD_NAMESPACE" \
              --create-namespace \
              --set global.image.registry="$INPUT_REGISTRY/$REPO_OWNER" \
              --set global.image.repository="$IMAGE_BASE" \
              --set global.image.tag="$RUN_ID" \
              --set global.image.pullPolicy="Always" \
              --set language="$INPUT_LANGUAGE" \
              "${VALUES_ARG[@]}"
          fi

      - name: Verify Prod Rollout
        shell: bash
        env:
          INPUT_PROD_NAMESPACE: ${{ inputs.prod_namespace }}
          RELEASE_NAME: ${{ steps.release_prod.outputs.release }}
        run: |
          ns="$INPUT_PROD_NAMESPACE"
          dep="$RELEASE_NAME"
          echo "⏳ Waiting for rollout: $dep in $ns ..."

          if ! kubectl rollout status deployment/"$dep" -n "$ns" --timeout=10m; then
            echo "❌ Rollout FAILED for $dep in prod"
            kubectl get pods -n "$ns"
            kubectl get events -n "$ns" --sort-by='.lastTimestamp' | tail -n 20
            exit 1
          fi
          echo "✅ $dep is healthy in prod"

      - name: Diagnostics on Failure
        if: failure()
        shell: bash
        env:
          INPUT_PROD_NAMESPACE: ${{ inputs.prod_namespace }}
          RELEASE_NAME: ${{ steps.release_prod.outputs.release }}
        run: |
          echo "🔍 Prod deployment failed. Diagnostics:"
          kubectl get pods -n "$INPUT_PROD_NAMESPACE" -o wide
          kubectl describe deployment/"$RELEASE_NAME" -n "$INPUT_PROD_NAMESPACE" 2>&1 | tail -n 30
