name: Central Build & Publish

on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
        description: "The primary language of the project (e.g., java, python, node, react)"
      working_directory:
        required: true
        type: string
        description: "The base directory of the sub-component relative to repo root"
      image_name:
        required: false
        type: string
        description: "Contabo / Argo service name and default image leaf (e.g. am-modern-ui)"
      ghcr_image_name:
        required: false
        type: string
        default: ""
        description: >-
          Optional GHCR path under owner. Empty = <git-repo>/<image_name>
          (repo-scoped so github.token can write_package). Pass explicit path
          only to override.
      registry:
        required: false
        type: string
        default: "ghcr.io"
        description: "Container registry to push to"
      build_context:
        required: false
        type: string
        default: "."
        description: "Docker build context relative to working_directory"
      preprod_namespace:
        required: false
        type: string
        default: "am-apps-preprod"
        description: "Kubernetes namespace for preprod"
      dev_namespace:
        required: false
        type: string
        default: "am-apps-dev"
        description: "Kubernetes namespace for development"
      prod_namespace:
        required: false
        type: string
        default: "am-apps-prod"
        description: "Kubernetes namespace for prod"
      # Deprecated no-ops (kept for caller API compat). Contabo Argo only â€” no Helm from GHA.
      deploy_dev:
        required: false
        type: boolean
        default: false
        description: "Deprecated no-op. Dev = Manual Deploy / am gitops set-tag + Contabo Argo."
      deploy_prod:
        required: false
        type: boolean
        default: false
        description: "Deprecated no-op. Prod = Manual Deploy promote + Contabo Argo (never Helm)."
      deploy_preprod:
        required: false
        type: boolean
        default: true
        description: >-
          Feature-branch: GHCR only notice job. Main: Contabo Argo preprod after gitops pin.
      force_preprod_helm:
        required: false
        type: boolean
        default: false
        description: "Deprecated no-op. Helm removed from central-build-publish."
      skip_security_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal security scans (set true when caller already ran a shared security gate)"
      skip_secrets_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal secrets scan (TruffleHog)"
      skip_iac_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal IaC configuration scan (Checkov)"
      skip_vulnerability_scan:
        required: false
        type: boolean
        default: false
        description: "Skip internal Docker image vulnerability scan (Trivy)"
      gh_env_dev:
        required: false
        type: string
        description: "Explicit GitHub environment name for dev deployment approval"
      gh_env_preprod:
        required: false
        type: string
        description: "Explicit GitHub environment name for preprod deployment approval"
      gh_env_prod:
        required: false
        type: string
        description: "Explicit GitHub environment name for prod deployment approval"
      no_cache:
        required: false
        type: boolean
        default: false
        description: "Force Docker to build without using cache"
      gitops_write_preprod:
        required: false
        type: boolean
        # Default on: main/master bumps am-gitops pins when digest changes (SoT + Argo sync).
        default: true
        description: >-
          Auto-commit image tag/digest to AM-Portfolio/am-gitops preprod/image-tags + releases/preprod
          when digest changes. Default true on main/master. Needs GITHUB_PAT contents:write on am-gitops.
      gitops_values_repo:
        required: false
        type: string
        default: ""
        description: "Service values repo URL for freeze (default: caller github.repository)"
      gitops_values_path:
        required: false
        type: string
        default: ""
        description: "Path under values repo to helm/ (default: working_directory)"
      contabo_wait_preprod:
        required: false
        type: boolean
        default: true
        description: >-
          When true (default), Contabo Argo sync+wait preprod runs after gitops pin (serial).
          Set false when using contabo_approve (parallel Environment Approve after Build).
      contabo_approve:
        required: false
        type: boolean
        default: false
        description: >-
          When true, Contabo Argo Environment Approve jobs run as siblings of Feature notice /
          GitOps after Build (dev+preprod on feat/PR; all four on main). No second image build.
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: false
        description: >-
          Contabo Argo CD API token (am-gitops argo-sync-on-tags for all envs after pin pushes).
      ARGOCD_SERVER:
        required: false
        description: "Contabo Argo CD base URL (default https://argocd.asrax.in)"
      KUBECONFIG_NONPROD:
        required: false
        description: "DEPRECATED â€” refused by CI. Do not store kubeconfig in GitHub. Use Argo API."
      KUBECONFIG_PROD:
        required: false
        description: "DEPRECATED â€” refused by CI. Prod = promote + Argo only."
    outputs:
      image_tag:
        description: "Published GHCR image tag (run id)"
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: "Published image digest"
        value: ${{ jobs.build.outputs.image_digest }}
      image_repository:
        description: "Published image repository"
        value: ${{ jobs.build.outputs.image_repository }}

jobs:
  # ============================================================
  # SECURITY SCAN â€” GitHub-hosted runner
  # Scans for secrets (tokens, keys) using TruffleHog OSS
  # ============================================================
  security-scan:
    name: Security Scan (Secrets)
    # Skip when caller already ran a shared security gate (e.g. unified-ci.yml)
    if: ${{ !inputs.skip_security_scan && !inputs.skip_secrets_scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog needs history to find leaks

      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@v3.94.3
        with:
          path: ./
          extra_args: --only-verified

  # ============================================================
  # MISCONFIG SCAN (IaC) â€” GitHub-hosted runner
  # Scans Helm charts and Terraform for security misconfigurations
  # ============================================================
  misconfig-scan:
    name: Security Scan (IaC)
    # Skip when caller already ran a shared security gate (e.g. unified-ci.yml)
    if: ${{ !inputs.skip_security_scan && !inputs.skip_iac_scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./
          framework: helm,terraform,kubernetes
          soft_fail: true # Set to true to avoid blocking the workflow
          quiet: true
          output_format: cli,sarif
          download_external_modules: true
          log_level: ERROR

  # ============================================================
  # BUILD â€” GitHub-hosted runner
  # Compiles, tests, builds and pushes Docker image to GHCR
  # ============================================================
  build:
    name: Build & Push
    needs: [security-scan, misconfig-scan]
    # Run when security jobs succeeded OR were intentionally skipped by caller
    if: |
      always() &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.push.outputs.tag }}
      image_repository: ${{ steps.push.outputs.repository }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - uses: actions/checkout@v4

      # â”€â”€ Java â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Set up JDK
        if: ${{ inputs.language == 'java' }}
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Create Maven settings.xml
        if: ${{ inputs.language == 'java' }}
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>x-access-token</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build Java Package
        if: ${{ inputs.language == 'java' }}
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MODULE="${{ inputs.working_directory }}"
          ROOT_POM="${{ github.workspace }}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE" != "." ] && grep -Fq "<module>${MODULE}</module>" "$ROOT_POM"; then
            echo "Monorepo reactor build: -pl ${MODULE} -am"
            mvn -B -f "$ROOT_POM" clean package -pl "$MODULE" -am -DskipTests
          else
            mvn -B -f "${{ github.workspace }}/${MODULE}/pom.xml" clean package -DskipTests
          fi

      - name: Run Java Tests
        if: ${{ inputs.language == 'java' }}
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MODULE="${{ inputs.working_directory }}"
          ROOT_POM="${{ github.workspace }}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE" != "." ] && grep -Fq "<module>${MODULE}</module>" "$ROOT_POM"; then
            mvn -B -f "$ROOT_POM" test -pl "$MODULE" -am || echo "Test step failed or skipped"
          else
            mvn -B -f "${{ github.workspace }}/${MODULE}/pom.xml" test || echo "Test step failed or skipped"
          fi

      # â”€â”€ Python â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Set up Python
        if: ${{ inputs.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        if: ${{ inputs.language == 'python' }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Python Tests
        if: ${{ inputs.language == 'python' }}
        run: |
          pip install pytest flake8
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          pytest || echo "Tests failed or not found - marking as skipped for now"

      # â”€â”€ Node.js / React â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Set up Node.js
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ inputs.working_directory }}/package-lock.json"

      - name: Install Node Dependencies
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm ci

      - name: Build Node/React Application
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm run build --if-present

      - name: Run Node Tests
        if: ${{ inputs.language == 'node' || inputs.language == 'react' }}
        run: npm test --if-present

      # â”€â”€ Docker â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Log in to GitHub Container Registry
        if: ${{ inputs.image_name != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          # Use job github.token (packages:write). Do not prefer org GHCR_TOKEN — a dead PAT
          # blocks login (|| does not fall through). Cross-repo pulls need package Actions access.
          password: ${{ github.token }}

      # Existing org packages often lack "Actions access" for this repo → write_package.
      # Default push path is repo-scoped: <git-repo>/<image_name> (github.token can write).
      - name: Ensure GHCR package linked to this repository
        if: ${{ inputs.image_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME_INPUT: ${{ inputs.ghcr_image_name }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -n "${GHCR_IMAGE_NAME_INPUT}" ]; then
            GHCR_IMAGE_NAME="${GHCR_IMAGE_NAME_INPUT}"
          elif [[ "${IMAGE_NAME}" == */* ]]; then
            GHCR_IMAGE_NAME="${IMAGE_NAME}"
          else
            GHCR_IMAGE_NAME="${REPO_NAME}/${IMAGE_NAME}"
          fi
          GHCR_IMAGE_NAME=$(echo "${GHCR_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          export GHCR_IMAGE_NAME
          PKG_ENC=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["GHCR_IMAGE_NAME"], safe=""))')
          REPO_ID=$(gh api "repos/${{ github.repository }}" --jq .id)
          echo "Linking package container/${GHCR_IMAGE_NAME} -> repo id $REPO_ID"
          gh api --method PUT \
            "orgs/${{ github.repository_owner }}/packages/container/${PKG_ENC}/repositories/${REPO_ID}" \
            || echo "::warning::Package link skipped (missing package yet, or token lacks package admin)"

      - name: Build and Push Docker Image
        id: push
        if: ${{ inputs.image_name != '' }}
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME_INPUT: ${{ inputs.ghcr_image_name }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -n "${GHCR_IMAGE_NAME_INPUT}" ]; then
            GHCR_IMAGE_NAME="${GHCR_IMAGE_NAME_INPUT}"
          elif [[ "${IMAGE_NAME}" == */* ]]; then
            GHCR_IMAGE_NAME="${IMAGE_NAME}"
          else
            GHCR_IMAGE_NAME="${REPO_NAME}/${IMAGE_NAME}"
          fi
          IMAGE_ID=${{ inputs.registry }}/${{ github.repository_owner }}/${GHCR_IMAGE_NAME}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          BASE_REG="ghcr.io/${{ github.repository_owner }}/"
          BASE_REG=$(echo $BASE_REG | tr '[A-Z]' '[a-z]')
          TAG="${{ github.run_id }}"

          echo "Building $IMAGE_ID ..."
          CACHE_ARG=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            CACHE_ARG="--no-cache"
          fi

          docker build $CACHE_ARG -f Dockerfile \
            --build-arg BASE_REGISTRY=$BASE_REG \
            --build-arg GITHUB_PACKAGES_USERNAME=${{ github.actor }} \
            --build-arg GITHUB_PACKAGES_TOKEN=${GHCR_TOKEN} \
            --build-arg BUILD_ID=${{ github.run_id }} \
            -t $IMAGE_ID:$TAG \
            -t $IMAGE_ID:latest \
            ${{ inputs.build_context }}

          echo "Pushing $IMAGE_ID ..."
          docker push $IMAGE_ID:$TAG
          docker push $IMAGE_ID:latest

          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_ID:$TAG" | awk -F@ '{print $2}')
          echo "repository=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # ============================================================
  # GITOPS â€” auto-commit preprod image-tags (SoT). Contabo Argo follows.
  # Requires org GITHUB_PAT (or GHCR_TOKEN) with contents:write on am-gitops.
  # ============================================================
  gitops-preprod:
    name: GitOps â†’ Preprod image-tags
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.image_name != '' &&
      inputs.gitops_write_preprod == true &&
      inputs.contabo_approve != true &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    permissions:
      contents: read
    steps:
      - name: Checkout am-gitops
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-gitops
          ref: main
          token: ${{ secrets.GITHUB_PAT || github.token }}
          path: am-gitops

      - name: Resolve chart SHA
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || github.token }}
        run: |
          SHA=$(gh api repos/AM-Portfolio/am-pipelines/commits/main --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Write freeze + image-tags
        env:
          SVC: ${{ inputs.image_name }}
          DIGEST: ${{ needs.build.outputs.image_digest }}
          TAG: ${{ needs.build.outputs.image_tag }}
          REPO: ${{ needs.build.outputs.image_repository }}
          CHART_SHA: ${{ steps.chart.outputs.sha }}
          SOURCE_SHA: ${{ github.sha }}
          VALUES_REPO_INPUT: ${{ inputs.gitops_values_repo }}
          VALUES_PATH_INPUT: ${{ inputs.gitops_values_path }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VALUES_REPO="${VALUES_REPO_INPUT:-https://github.com/${GITHUB_REPOSITORY}.git}"
          VALUES_PATH="${VALUES_PATH_INPUT:-${WORKING_DIRECTORY}}"
          mkdir -p "am-gitops/releases/preprod" "am-gitops/preprod/image-tags"
          {
            echo "# CI-written freeze â€” do not hand-edit for enrolled services"
            echo "image:"
            echo "  repository: ${REPO}"
            echo "  digest: ${DIGEST}"
            echo "  tag: \"${TAG}\""
            echo "chart:"
            echo "  repoURL: https://github.com/AM-Portfolio/am-pipelines.git"
            echo "  path: helm/universal-chart"
            echo "  targetRevision: \"${CHART_SHA}\""
            echo "values:"
            echo "  repoURL: ${VALUES_REPO}"
            echo "  targetRevision: \"${SOURCE_SHA}\""
            echo "  files:"
            echo "    - ${VALUES_PATH}/helm/values.yaml"
            echo "    - ${VALUES_PATH}/helm/vault-mappings.yaml"
            echo "    - ${VALUES_PATH}/helm/values.preprod.yaml"
            echo "sourceCommit: \"${SOURCE_SHA}\""
          } > "am-gitops/releases/preprod/${SVC}.yaml"
          {
            echo "# Synced from releases/preprod/${SVC}.yaml (CI auto-commit)"
            echo "global:"
            echo "  image:"
            if [ -n "${DIGEST}" ]; then
              echo "    digest: \"${DIGEST}\""
            fi
            echo "    tag: \"${TAG}\""
            echo "    imagePullSecrets:"
            echo "      - name: ghcr-creds"
          } > "am-gitops/preprod/image-tags/${SVC}.yaml"

      - name: Commit and push
        working-directory: am-gitops
        env:
          SVC: ${{ inputs.image_name }}
          DIGEST: ${{ needs.build.outputs.image_digest }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name "am-gitops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PIN="preprod/image-tags/${SVC}.yaml"
          # Idempotent: compare NEW digest to what is on origin/main (not the file we just wrote)
          if [[ -n "${DIGEST}" ]]; then
            OLD="$(git show "HEAD:${PIN}" 2>/dev/null | grep -E '^\s*digest:' | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
            if [[ -n "$OLD" && "$OLD" == "$DIGEST" ]]; then
              echo "No digest change (${DIGEST}) â€” skip gitops commit"
              exit 0
            fi
          fi
          git add "releases/preprod/${SVC}.yaml" "$PIN"
          if git diff --cached --quiet; then
            echo "No gitops changes"
            exit 0
          fi
          git commit -m "freeze(preprod/${SVC}): ${TAG}"
          git push origin HEAD:main

  # ============================================================
  # CONTABO ARGO â€” sync+wait preprod after main pin (fail if not Healthy)
  # ============================================================
  # Skipped when caller sets contabo_wait_preprod: false (gateways run Contabo in parallel approve jobs).
  argo-preprod:
    name: Contabo Argo â†’ preprod (central)
    needs: [build, gitops-preprod]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.image_name != '' &&
      inputs.gitops_write_preprod == true &&
      inputs.contabo_wait_preprod &&
      inputs.contabo_approve != true &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.build.result == 'success' &&
      needs.gitops-preprod.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || github.token }}

      - name: Sync + wait Contabo Healthy/Synced
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: ${{ inputs.image_name }}
          INPUT_ENVIRONMENT: preprod
          INPUT_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          sleep 5
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-sync-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-sync-and-wait.sh

  # ============================================================
  # VULNERABILITY SCAN â€” GitHub-hosted runner
  # Scans the built Docker image for CVEs
  # ============================================================
  vulnerability-scan:
    name: Security Scan (Vulnerabilities)
    needs: build
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      !inputs.skip_security_scan &&
      !inputs.skip_vulnerability_scan
    permissions:
      contents: read
      packages: read
    steps:
      - name: Lowercase Image Ref
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          GHCR_IMAGE_NAME_INPUT: ${{ inputs.ghcr_image_name }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [ -n "${GHCR_IMAGE_NAME_INPUT}" ]; then
            GHCR_IMAGE_NAME="${GHCR_IMAGE_NAME_INPUT}"
          elif [[ "${IMAGE_NAME}" == */* ]]; then
            GHCR_IMAGE_NAME="${IMAGE_NAME}"
          else
            GHCR_IMAGE_NAME="${REPO_NAME}/${IMAGE_NAME}"
          fi
          ref="ghcr.io/${{ github.repository_owner }}/${GHCR_IMAGE_NAME}:${{ github.run_id }}"
          echo "ref=$(echo $ref | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Non-blocking (reports but continues)

  # ============================================================
  # AUTO SYNC PREPROD â€” Contabo refresh only (NO am-gitops commit)
  # Top rail when contabo_approve: sync live app; pin happens on Approve.
  # ============================================================
  auto-sync-preprod:
    name: Auto sync â†’ preprod (no gitops commit)
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    if: |
      always() &&
      inputs.contabo_approve == true &&
      inputs.image_name != '' &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (
        (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) ||
        (github.head_ref || github.ref_name) == 'develop' ||
        startsWith(github.head_ref || github.ref_name, 'feature/') ||
        startsWith(github.head_ref || github.ref_name, 'feat/') ||
        startsWith(github.head_ref || github.ref_name, 'fix/') ||
        startsWith(github.head_ref || github.ref_name, 'hotfix/')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || github.token }}

      - name: Resolve image tag
        id: tag
        env:
          TAG_FROM_BUILD: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_FROM_BUILD:-}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag from build"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Contabo sync + wait (no pin write)
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: ${{ inputs.image_name }}
          INPUT_ENVIRONMENT: preprod
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "::notice::Auto sync Contabo preprod â€” no am-gitops commit. New tag deploys after Contabo Approve."
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-sync-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-sync-and-wait.sh

  # ============================================================
  # FEATURE BRANCH â€” GHCR publish only (no ci-image bot commits)
  # ============================================================
  preprod-feature-argo:
    name: Feature â†’ GHCR only (no bot commit)
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.image_name != '' && inputs.deploy_preprod == true &&
      github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Notice â€” image published; no service-repo bot commit
        run: |
          TAG="${{ needs.build.outputs.image_tag || github.run_id }}"
          echo "::notice::Image published to GHCR tag=${TAG}. No ci-image.yaml commit (avoids CI loops)."
          echo "::notice::Contabo dev/preprod/prod/dr Approve: one Matrix box after Build. Auto sync preprod has no gitops commit."

  # ============================================================
  # CONTABO APPROVE â€” one Matrix box: dig + preprod (+ prod/dr on main)
  # ============================================================
  contabo-approve:
    name: Contabo Argo â†’ ${{ matrix.env }} (approve)
    needs: [build, vulnerability-scan, misconfig-scan, security-scan]
    if: |
      always() &&
      inputs.contabo_approve == true &&
      inputs.image_name != '' &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      needs.build.result == 'success' &&
      (needs.vulnerability-scan.result == 'success' || needs.vulnerability-scan.result == 'skipped') &&
      (needs.misconfig-scan.result == 'success' || needs.misconfig-scan.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped') &&
      (
        (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) ||
        (github.head_ref || github.ref_name) == 'develop' ||
        startsWith(github.head_ref || github.ref_name, 'feature/') ||
        startsWith(github.head_ref || github.ref_name, 'feat/') ||
        startsWith(github.head_ref || github.ref_name, 'fix/') ||
        startsWith(github.head_ref || github.ref_name, 'hotfix/')
      )
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON((github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) && '["dev","preprod","prod","dr"]' || '["dev","preprod"]') }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    permissions:
      contents: read
    steps:
      - name: Checkout am-pipelines scripts
        uses: actions/checkout@v4
        with:
          repository: AM-Portfolio/am-pipelines
          path: am-pipelines-repo
          ref: main
          token: ${{ secrets.GITHUB_PAT || github.token }}

      - name: Resolve image tag
        id: tag
        env:
          TAG_FROM_BUILD: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_FROM_BUILD:-}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No image tag from build"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Contabo pin + wait (dev / preprod)
        if: matrix.env == 'dev' || matrix.env == 'preprod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || github.token }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: ${{ inputs.image_name }}
          INPUT_ENVIRONMENT: ${{ matrix.env }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-pin-and-wait.sh

      - name: Contabo promote + wait (prod / dr)
        if: matrix.env == 'prod' || matrix.env == 'dr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT || github.token }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          INPUT_SERVICE_NAME: ${{ inputs.image_name }}
          INPUT_ENVIRONMENT: ${{ matrix.env }}
          INPUT_IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x am-pipelines-repo/scripts/ci/argo-api-lib.sh
          chmod +x am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh
          am-pipelines-repo/scripts/ci/argo-promote-and-wait.sh
