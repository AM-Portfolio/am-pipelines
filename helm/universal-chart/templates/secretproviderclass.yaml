{{- $vaultEnabled := or .Values.global.vault.enabled (and .Values.vault .Values.vault.enabled | default false) }}
{{- $vaultCsiEnabled := and $vaultEnabled (or .Values.global.vault.csi.enabled (and .Values.vault .Values.vault.csi .Values.vault.csi.enabled | default false)) }}
{{- $vaultSecrets := merge (default (dict) .Values.global.vault.secrets) (and .Values.vault .Values.vault.secretPaths | default (dict)) }}
{{- if $vaultCsiEnabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "universal-chart.fullname" . }}-vault-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider: vault
  parameters:
    vaultAddress: {{ include "universal-chart.vaultAddress" . | quote }}
    roleName: {{ and .Values.vault .Values.vault.role | default .Values.global.vault.role | default "am-backend-role" | quote }}
    vaultAuthMountPath: {{ include "universal-chart.vaultAuthMountPath" . | quote }}
    vaultCACertGen: "false"
    objects: |
{{- range $k, $v := $vaultSecrets }}
{{- if and (not (kindIs "string" $v)) $v.mappings $v.path }}
{{- range $moduleVar, $vaultKey := $v.mappings }}
{{- if ne $vaultKey "__jaas__" }}
      - objectName: "{{ $k }}_{{ $moduleVar }}"
        secretPath: "{{ $v.path }}"
        secretKey: "{{ $vaultKey }}"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
  secretObjects:
    - secretName: {{ include "universal-chart.fullname" . }}-synced-secrets
      type: Opaque
      data:
{{- range $k, $v := $vaultSecrets }}
{{- if and (not (kindIs "string" $v)) $v.mappings }}
{{- range $moduleVar, $vaultKey := $v.mappings }}
{{- if ne $vaultKey "__jaas__" }}
        - objectName: "{{ $k }}_{{ $moduleVar }}"
          key: "{{ $moduleVar }}"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
