name: Publish Library
# Reusable workflow — called by repo workflows on push/merge to main (and PRs where configured).
#
# Inputs:
#   action: publish (deploy/release) | verify (build/test only, no registry push)
#   use_release_version: request -SNAPSHOT strip (honored only on refs/heads/main or refs/heads/master)
#
# java   → mvn deploy → GitHub Packages (github / github-core / github-investment ids)
# python → wheel/sdist → GitHub Release
# flutter → analyze/test → zip → GitHub Release (skipped when pubspec has publish_to: none)

on:
  workflow_call:
    inputs:
      language:
        description: 'SDK language: python | java | flutter'
        required: true
        type: string
      working_directory:
        description: 'Path to the SDK/library directory (relative to repo root)'
        required: true
        type: string
      sdk_name:
        description: 'Canonical name for release tags (e.g. am-common-lib)'
        required: false
        type: string
        default: ''
      action:
        description: 'publish (deploy/release) or verify (build/test only)'
        required: false
        type: string
        default: 'publish'
      use_release_version:
        description: 'Request -SNAPSHOT strip before Java publish (applied only on refs/heads/main or refs/heads/master)'
        required: false
        type: boolean
        default: false
      advance_snapshot:
        description: 'Whether to auto-advance Java version to next snapshot and push to branch (main/master only)'
        required: false
        type: boolean
        default: false
      maven_repo_id:
        description: 'Maven server id in pom.xml distributionManagement (java only)'
        required: false
        type: string
        default: 'github'
      maven_repo_url:
        description: 'GitHub Packages Maven URL (java only)'
        required: false
        type: string
        default: ''
      git_ref:
        description: 'Optional git ref to checkout (e.g. pre-bump SHA for SDK publish after Core Libraries)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    name: Publish ${{ inputs.sdk_name || inputs.working_directory }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve SDK name
        id: meta
        run: |
          SDK_NAME="${{ inputs.sdk_name }}"
          if [ -z "$SDK_NAME" ]; then
            SDK_NAME=$(basename "${{ inputs.working_directory }}")
          fi
          echo "sdk_name=$SDK_NAME" >> $GITHUB_OUTPUT

      # ── Python ──────────────────────────────────────────────────────────
      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Python wheel and sdist
        if: inputs.language == 'python'
        working-directory: ${{ inputs.working_directory }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify Python package
        if: inputs.language == 'python' && inputs.action == 'verify'
        working-directory: ${{ inputs.working_directory }}
        run: |
          pip install pytest
          if [ -d "test" ] || [ -d "tests" ]; then pytest; else echo "No tests directory — skipping pytest."; fi

      - name: Read Python version
        if: inputs.language == 'python' && inputs.action == 'publish'
        id: py_version
        working-directory: ${{ inputs.working_directory }}
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*=\s*["\x27]\(.*\)["\x27].*/\1/' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish Python SDK to GitHub Release
        if: inputs.language == 'python' && inputs.action == 'publish'
        working-directory: ${{ inputs.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK="${{ steps.meta.outputs.sdk_name }}"
          VER="${{ steps.py_version.outputs.version }}"
          TAG="${SDK}-v${VER}"
          WHL=$(ls dist/*.whl | xargs basename)
          cat > /tmp/release-notes.md <<EOF
          ## ${SDK} v${VER}
          ### Install
          \`\`\`bash
          pip install https://github.com/${{ github.repository }}/releases/download/${TAG}/${WHL}
          \`\`\`
          EOF
          gh release create "$TAG" dist/* --title "${SDK} v${VER}" --notes-file /tmp/release-notes.md --repo "${{ github.repository }}" \
            2>/dev/null || gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

      # ── Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create Maven settings.xml
        if: inputs.language == 'java'
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-investment</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-trade</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Promote to release version (strip SNAPSHOT, CI only)
        if: >-
          inputs.language == 'java'
          && inputs.action == 'publish'
          && inputs.use_release_version
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          MAVEN_REPO_URL: ${{ inputs.maven_repo_url }}
        run: |
          ROOT_POM="${{ github.workspace }}/pom.xml"
          MODULE_DIR="${{ inputs.working_directory }}"
          MODULE_POM="${{ github.workspace }}/${MODULE_DIR}/pom.xml"

          bump_if_exists() {
            local POM_FILE="$1"
            local RELEASE
            RELEASE=$(mvn -N -q -f "$POM_FILE" -DforceStdout help:evaluate -Dexpression=project.version 2>/dev/null)

            # Auto-increment patch version if this release already exists in the registry
            while true; do
              GROUP_ID=$(mvn -N -q -f "$POM_FILE" -DforceStdout help:evaluate -Dexpression=project.groupId 2>/dev/null)
              ARTIFACT_ID=$(mvn -N -q -f "$POM_FILE" -DforceStdout help:evaluate -Dexpression=project.artifactId 2>/dev/null)
              GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
              CHECK_URL="${MAVEN_REPO_URL}/${GROUP_PATH}/${ARTIFACT_ID}/${RELEASE}/${ARTIFACT_ID}-${RELEASE}.pom"
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $GITHUB_TOKEN" "$CHECK_URL")
              echo "Registry check for $RELEASE -> HTTP $HTTP_STATUS"
              if [ "$HTTP_STATUS" == "200" ]; then
                echo "Version $RELEASE already exists in registry. Auto-incrementing patch version."
                MAJOR=$(echo "$RELEASE" | cut -d. -f1)
                MINOR=$(echo "$RELEASE" | cut -d. -f2)
                PATCH=$(echo "$RELEASE" | cut -d. -f3 | sed 's/-.*//')
                PATCH=$((PATCH + 1))
                RELEASE="${MAJOR}.${MINOR}.${PATCH}"
                mvn -B -f "$POM_FILE" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                  -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
              else
                echo "Version $RELEASE is free. Proceeding with publish."
                break
              fi
            done
            echo "FINAL_RELEASE_VERSION=$RELEASE" >> "$GITHUB_ENV"
          }

          if [ -f "$ROOT_POM" ] && [ "$MODULE_DIR" != "." ] && [ "$MODULE_DIR" != "./" ]; then
            echo "Workspace-level root pom.xml found. Evaluating and promoting from reactor root."
            CURRENT=$(mvn -N -q -f "$ROOT_POM" -DforceStdout help:evaluate -Dexpression=project.version)
            echo "Current version: $CURRENT"
            if echo "$CURRENT" | grep -q 'SNAPSHOT'; then
              mvn -B -f "$ROOT_POM" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                -DremoveSnapshot -DgenerateBackupPoms=false
            else
              echo "Already a release version — no change."
            fi

            bump_if_exists "$ROOT_POM"
            RELEASE="$FINAL_RELEASE_VERSION"
            echo "Release version: $RELEASE"

            # Keep the target module aligned with the promoted root (covers modules outside the reactor).
            perl -i -0pe "s/(<artifactId>am-core-services<\/artifactId>\s*<version>)[^<]+(<\/version>)/\${1}${RELEASE}\${2}/" "$MODULE_POM"

            if grep -Fq "<module>${MODULE_DIR}</module>" "$ROOT_POM"; then
              mvn -B -f "$ROOT_POM" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                -pl "$MODULE_DIR" -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
            else
              mvn -B -f "$MODULE_POM" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
            fi
          else
            CURRENT=$(mvn -N -q -f "$MODULE_POM" -DforceStdout help:evaluate -Dexpression=project.version)
            echo "Current version: $CURRENT"
            if echo "$CURRENT" | grep -q 'SNAPSHOT'; then
              echo "Promoting version locally in working directory."
              mvn -B -f "$MODULE_POM" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                -DremoveSnapshot -DgenerateBackupPoms=false
            else
              echo "Already a release version — no change."
            fi

            bump_if_exists "$MODULE_POM"
            RELEASE="$FINAL_RELEASE_VERSION"
            echo "Release version: $RELEASE"
          fi

      - name: Verify Java library
        if: inputs.language == 'java' && inputs.action == 'verify'
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ROOT_POM="${{ github.workspace }}/pom.xml"
          MODULE_DIR="${{ inputs.working_directory }}"
          MODULE_POM="${{ github.workspace }}/${MODULE_DIR}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE_DIR" != "." ] && [ "$MODULE_DIR" != "./" ] && grep -Fq "<module>${MODULE_DIR}</module>" "$ROOT_POM"; then
            mvn -B -f "$ROOT_POM" clean verify -pl "$MODULE_DIR" -DskipTests
          else
            mvn -B -f "$MODULE_POM" clean verify -DskipTests
          fi

      - name: Build and Deploy Java library to GitHub Packages
        if: inputs.language == 'java' && inputs.action == 'publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ROOT_POM="${{ github.workspace }}/pom.xml"
          MODULE_DIR="${{ inputs.working_directory }}"
          MODULE_POM="${{ github.workspace }}/${MODULE_DIR}/pom.xml"
          if [ -f "$ROOT_POM" ] && [ "$MODULE_DIR" != "." ] && [ "$MODULE_DIR" != "./" ] && grep -Fq "<module>${MODULE_DIR}</module>" "$ROOT_POM"; then
            MVN_DEPLOY=(mvn -B -f "$ROOT_POM" clean deploy -pl "$MODULE_DIR" -DskipTests)
          else
            MVN_DEPLOY=(mvn -B -f "$MODULE_POM" clean deploy -DskipTests)
          fi
          "${MVN_DEPLOY[@]}" > deploy.log 2>&1 || {
            status=$?
            cat deploy.log
            if grep -q "status code: 409" deploy.log || grep -q "Conflict (409)" deploy.log; then
              echo "WARNING: Library version already deployed (409 Conflict). Skipping deploy."
              exit 0
            else
              exit $status
            fi
          }
          cat deploy.log

      - name: Advance library to next snapshot and push
        if: >-
          inputs.language == 'java'
          && inputs.action == 'publish'
          && inputs.use_release_version
          && inputs.advance_snapshot
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -f "${{ github.workspace }}/pom.xml" ] && [ "${{ inputs.working_directory }}" != "." ] && [ "${{ inputs.working_directory }}" != "./" ]; then
            echo "Workspace-level root pom.xml found. Advancing parent and submodules at root."
            mvn -B -f "${{ github.workspace }}/pom.xml" org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
              -DnextSnapshot=true -DgenerateBackupPoms=false
            echo "Verifying root build compiles with next snapshot version..."
            mvn -B -f "${{ github.workspace }}/pom.xml" clean compile -DskipTests
          else
            echo "Advancing version locally in working directory."
            mvn -B org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
              -DnextSnapshot=true -DgenerateBackupPoms=false
            echo "Verifying local build compiles with next snapshot version..."
            mvn -B clean compile -DskipTests
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')

            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt $i of $MAX_RETRIES..."

              # Always reset to the latest remote tip before committing.
              # This avoids detached HEAD, merge-commit rebase issues, and history conflicts.
              git fetch origin $BRANCH_NAME
              git checkout -B $BRANCH_NAME origin/$BRANCH_NAME

              # Re-stage and commit the version bump files on top of the fresh tip.
              git add -u
              git commit -m "chore: bump version to next snapshot version [skip ci]" || {
                echo "Nothing to commit. Exiting."
                exit 0
              }

              if git push origin $BRANCH_NAME; then
                echo "Push succeeded on attempt $i!"
                exit 0
              fi

              echo "Push failed. Waiting 5 seconds before retry..."
              sleep 5
            done

            echo "Failed to push version bump after $MAX_RETRIES attempts."
            exit 1
          else
            echo "No version changes detected."
          fi

      # ── Flutter ─────────────────────────────────────────────────────────
      - name: Set up Flutter
        if: inputs.language == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Skip non-publishable Flutter package
        if: inputs.language == 'flutter'
        id: flutter_publishable
        working-directory: ${{ inputs.working_directory }}
        run: |
          if grep -qE '^publish_to:\s*["\x27]?none' pubspec.yaml 2>/dev/null; then
            echo "publishable=false" >> $GITHUB_OUTPUT
            echo "publish_to: none — verify only."
          else
            echo "publishable=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify Flutter SDK
        if: inputs.language == 'flutter'
        working-directory: ${{ inputs.working_directory }}
        run: |
          flutter pub get
          flutter analyze
          if [ -d test ]; then flutter test; else echo "No test/ directory — skipping flutter test."; fi

      - name: Read Flutter version
        if: inputs.language == 'flutter' && inputs.action == 'publish' && steps.flutter_publishable.outputs.publishable == 'true'
        id: flutter_version
        working-directory: ${{ inputs.working_directory }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version://;s/["'"'"' ]//g;s/+.*//' | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Zip Flutter SDK source
        if: inputs.language == 'flutter' && inputs.action == 'publish' && steps.flutter_publishable.outputs.publishable == 'true'
        working-directory: ${{ inputs.working_directory }}
        run: |
          SDK="${{ steps.meta.outputs.sdk_name }}"
          VER="${{ steps.flutter_version.outputs.version }}"
          mkdir -p dist
          zip -r "dist/${SDK}-${VER}.zip" . --exclude "dist/*" ".git/*" ".dart_tool/*" "build/*"

      - name: Publish Flutter SDK to GitHub Release
        if: inputs.language == 'flutter' && inputs.action == 'publish' && steps.flutter_publishable.outputs.publishable == 'true'
        working-directory: ${{ inputs.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK="${{ steps.meta.outputs.sdk_name }}"
          VER="${{ steps.flutter_version.outputs.version }}"
          TAG="${SDK}-v${VER}"
          gh release create "$TAG" dist/*.zip --title "${SDK} v${VER}" --repo "${{ github.repository }}" \
            2>/dev/null || gh release upload "$TAG" dist/*.zip --clobber --repo "${{ github.repository }}"
